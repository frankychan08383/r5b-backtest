              if local is None:raise RuntimeError('MINUTE_DOWNLOAD_FAILED:'+str(errs))
              digest=sha(local);pf=pq.ParquetFile(local);names=pf.schema_arrow.names
              needed=['timestamp','open','high','low','close','volume']
              if not set(needed)<=set(names):raise ValueError('MINUTE_SCHEMA_FIELDS_MISSING')
              cols=[n for n in ['symbol','exchange',*needed,'turnover'] if n in names]
              raw=[];source_offset=0;start=datetime.fromisoformat(contract['warmup']);end=datetime.fromisoformat(contract['buffer_end'])+timedelta(days=1)
              for batch in pf.iter_batches(batch_size=65536,columns=cols):
                  table=pa.Table.from_batches([batch]);typ=table.schema.field('timestamp').type
                  if typ.tz is not None:raise ValueError('TIMEZONE_SCHEMA_CHANGE_REQUIRES_EXPLICIT_ADAPTER')
                  mask=pc.and_(pc.greater_equal(table['timestamp'],pa.scalar(start,type=typ)),pc.less(table['timestamp'],pa.scalar(end,type=typ)))
                  selection=table.filter(mask)
                  for r in selection.to_pylist():
                      if r.get('symbol') is not None and str(r['symbol']).zfill(6)!=rec['symbol']:raise ValueError('SOURCE_SYMBOL_MISMATCH')
                      if r.get('exchange') is not None and r['exchange']!=rec['exchange']:raise ValueError('SOURCE_EXCHANGE_MISMATCH')
                      r['timestamp']=r['timestamp'].isoformat(' ');raw.append(r)
                  source_offset+=batch.num_rows
              meta={'native_sha256':digest,'native_bytes':local.stat().st_size,'fullspan_rows':source_offset,'export_rows':len(raw),'revision':contract['revision'],'path':rec['path'],'bar_label_semantics':'UNVERIFIED_START_ASSUMPTION','download_retry_errors':errs}
              del pf
              return raw,meta

          def replay_one(rec,raw,daily,basic,calendar,contract):
              code=rec['exchange'].lower()+'.'+rec['symbol']
              if any(r.get('code')!=code for r in daily):raise ValueError('DAILY_IDENTITY_MISMATCH')
              if basic.get('code')!=code:raise ValueError('BASIC_IDENTITY_MISMATCH')
              if basic.get('type')!='1':raise ValueError('BASIC_NOT_STOCK')
              if any(r.get('adjustflag')!='3' for r in daily):raise ValueError('DAILY_PRICE_BASIS_NOT_UNADJUSTED')
              if rec['board']=='BSE':raise ValueError('BSE_REFERENCE_AND_HISTORICAL_ID_BRIDGE_NOT_CERTIFIED')
              selected_calendar,calendar_audit=calendar_segment(calendar,contract)
              cal=[date.fromisoformat(r['calendar_date']) for r in selected_calendar if r['is_trading_day']=='1']
              if not cal:raise ValueError('NO_TRADING_CALENDAR')
              E.START=date.fromisoformat(contract['start']);E.END=date.fromisoformat(contract['end'])
              infos,audits=E.prepare(symbol_key(rec),rec['board'],raw,daily,basic,cal)
              # One primary pass for every frozen factor variant; execution sensitivities
              # are separate scenarios, not additional independent economic trades.
              si,tr=E.scan(symbol_key(rec),infos,cal,variants=E.VARIANTS,modes=['NEXT_OPEN_RECHECK'],paths=['STOP_FIRST'])
              for mode,path,eod in [('NEXT_OPEN_MARKET','STOP_FIRST','EOD_OPEN'),('NEXT_OPEN_RECHECK','TP_FIRST','EOD_OPEN'),('NEXT_OPEN_MARKET','TP_FIRST','EOD_OPEN'),('NEXT_OPEN_RECHECK','STOP_FIRST','EOD_CLOSE_LEGACY')]:
                  a,b=E.scan(symbol_key(rec),infos,cal,variants=['FILTERED','BEST'],modes=[mode],paths=[path],eod_mode=eod);si+=a;tr+=b
              for r in si+tr:r['board']=rec['board'];r['sample_status']='CONDITIONAL_DATA_QUALIFIED_RESEARCH'
              return {'signals':si,'trades':tr,'day_audit':audits,'calendar_used':[str(d) for d in cal],'calendar_audit':calendar_audit}

          def expected_reference_years(basic,contract):
              first=date.fromisoformat(basic['ipoDate']) if basic.get('ipoDate') else date(contract['first_year'],1,1)
              last=date.fromisoformat(basic['outDate']) if basic.get('outDate') else date(contract['last_year'],12,31)
              return {y for y in range(contract['first_year'],contract['last_year']+1) if date(y,12,31)>=first and date(y,1,1)<=last}

          def checkpoint_valid(obj,contract,key):
              return obj.get('contract_sha256')==contract['contract_sha256'] and obj.get('symbol')==key and obj.get('processing_finished') is True and not obj.get('retryable')

          def shard_run(args):
              out=Path(args.out);out.mkdir(parents=True,exist_ok=True);plan=Path(args.plan)
              c=json.loads((plan/'contract.json').read_text());items=[r for r in json.loads((plan/'inventory.json').read_text()) if r['shard']==args.shard]
              if args.shard<0 or args.shard>=c['shards']:raise ValueError('SHARD_ID_OUTSIDE_PLAN')
              s=seed_data();seed_daily=defaultdict(list)
