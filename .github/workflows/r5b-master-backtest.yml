# One upload. One workflow. Fixed provider inventory, NOT automatic full-A certification.
name: R5B Master All-Stock Backtest
run-name: R5B Master ${{ inputs.first_year }}-${{ inputs.last_year }} full inventory

on:
  workflow_dispatch:
    inputs:
      first_year:
        description: First signal year (keep 2023 for the full three-year run)
        type: choice
        options: ['2023', '2024', '2025']
        default: '2023'
      last_year:
        description: Last signal year
        type: choice
        options: ['2023', '2024', '2025']
        default: '2025'
      shards:
        description: Number of balanced shards; 128 processes ALL inventory, not 128 stocks
        type: choice
        options: ['128', '64', '32']
        default: '128'
      retain_raw:
        description: Optional full target minute CSV in PART artifacts (large storage); FINAL is compact
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: r5b-master-full-inventory
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_ETAG_TIMEOUT: '30'
  HF_HUB_DOWNLOAD_TIMEOUT: '90'
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      contract: ${{ steps.plan.outputs.contract }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Write engine, tests, complete fixed inventory and public 2023 reference cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/src bundle/tests bundle/plan
          cat > bundle/src/r5b_engine.py <<'R5B_SRC_R5B_ENGINE_PY_EOF'
          """R5B Master: frozen-rule conditional event replay (derived from Phase3).
          Research only. No orders, no portfolio returns, no parameter training.
          Bar START labels and intrabar OHLC crossing are explicitly UNVERIFIED hypotheses.
          """
          from __future__ import annotations
          import argparse,bisect,csv,gzip,hashlib,io,json,math,os,shutil,statistics,struct,sys,time,traceback
          from collections import Counter,defaultdict
          from datetime import date,datetime,timedelta
          from decimal import Decimal,ROUND_HALF_UP
          from fractions import Fraction
          from pathlib import Path
          from dataclasses import dataclass
          YEAR=2023
          REPO='neigezhu/china-a-share-1min-ohlcv'
          REVISION='ba589a11534825044fe5a6b84838f50ba8d8d188'
          START=date(2023,1,1);END=date(2023,12,31)
          WARMUP=date(2022,12,1);BUFFER_END=date(2024,1,31)
          VARIANTS=['BASE_RAW','D4_ONLY','G9_ONLY','FILTERED','BEST','ABL_TIME','ABL_DIST6','ABL_GAIN35','ABL_TIME_DIST6','ABL_TIME_GAIN35','ABL_DIST6_GAIN35']
          COSTS=[0,10,20,30,50]
          def jdump(p,x):
              p=Path(p);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(x,ensure_ascii=False,indent=2,default=str,allow_nan=False),encoding='utf-8')
          def write_rows(p,rows):
              p=Path(p);p.parent.mkdir(parents=True,exist_ok=True);rows=list(rows)
              keys=list(dict.fromkeys(k for r in rows for k in r))
              with p.open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=keys);w.writeheader();w.writerows(rows)
          def read_rows(p):
              with Path(p).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def digest(p):
              h=hashlib.sha256()
              with Path(p).open('rb') as f:
                  for x in iter(lambda:f.read(1024*1024),b''):h.update(x)
              return h.hexdigest()
          def price_cents(value):
              x=float(value)
              if not math.isfinite(x) or x<=0:raise ValueError('NONPOSITIVE_OR_NONFINITE_PRICE')
              c=int((Decimal(str(x))*100).to_integral_value(rounding=ROUND_HALF_UP));q=c/100
              f32=struct.unpack('<f',struct.pack('<f',q))[0]
              if min(abs(x-q),abs(x-f32))>max(math.ulp(x)*4,1e-12):
                  raise ValueError('PRICE_NOT_CENT_OR_FLOAT32_CENT_ENCODING: '+str(value))
              return c

          def limit_cents(ref:int,pct:int,up:bool=True):
              return (ref*(100+pct if up else 100-pct)+50)//100

          def phase(t):
              m=t.hour*60+t.minute
              return 1 if 570<=m<690 else 2 if 780<=m<897 else 0

          def band(v,r,u,t):
              timed=v in {'BEST','ABL_TIME','ABL_TIME_DIST6','ABL_TIME_GAIN35'}
              if timed and t.hour*60+t.minute>=630:return None
              lo=min((103*r+99)//100,(100*u+104)//105)
              hi=u-1
              filtered=v not in {'BASE_RAW','D4_ONLY','G9_ONLY'}
              if filtered or v=='D4_ONLY':hi=min(hi,(100*u)//104)
              if filtered or v=='G9_ONLY':hi=min(hi,(109*r+99)//100-1)
              if v in {'BEST','ABL_DIST6','ABL_TIME_DIST6','ABL_DIST6_GAIN35'}:hi=min(hi,(100*u+105)//106-1)
              if v in {'BEST','ABL_GAIN35','ABL_TIME_GAIN35','ABL_DIST6_GAIN35'}:
                  lo=max(lo,(103*r+99)//100);hi=min(hi,105*r//100)
              return (lo,hi) if lo<=hi else None

          @dataclass(frozen=True)
          class Bar:
              t:datetime;o:int;h:int;l:int;c:int;v:int

          def to_bar(x):
              t=x['timestamp']
              if not isinstance(t,datetime):t=datetime.fromisoformat(str(t))
              if t.tzinfo is not None:
                  from zoneinfo import ZoneInfo
                  t=t.astimezone(ZoneInfo('Asia/Shanghai')).replace(tzinfo=None)
              if t.second or t.microsecond:raise ValueError('NON_MINUTE_TIMESTAMP')
              p=[price_cents(x[k]) for k in ['open','high','low','close']]
              if p[2]>min(p[0],p[3]) or p[1]<max(p[0],p[3]):raise ValueError('BAD_OHLC')
              vv=float(x['volume'])
              if not math.isfinite(vv) or vv<0 or not vv.is_integer():raise ValueError('BAD_VOLUME')
              return Bar(t,*p,int(vv))

          def ipo_window(ipo,board,d,calendar):
              if not ipo:return None
              ipo=date.fromisoformat(ipo)
              if d<ipo:return True
              # An IPO before the complete calendar's first date cannot be miscounted
              # from January 1. Require sufficient known sessions before target day.
              if ipo<calendar[0]:
                  return False if bisect.bisect_right(calendar,d)>=5 else None
              n=bisect.bisect_right(calendar,d)-bisect.bisect_left(calendar,ipo)
              nfree=5 if board in ('STAR','CHINEXT') or ipo>=date(2023,4,10) else 1
              return 1<=n<=nfree

          def prepare(symbol,board,raw_rows,daily_rows,basic,calendar):
              if not calendar or calendar!=sorted(set(calendar)):raise ValueError('BAD_OR_EMPTY_CALENDAR')
              if len({r['date'] for r in daily_rows})!=len(daily_rows):raise ValueError('DUPLICATE_DAILY_ROWS')
              days=defaultdict(list);last=None
              for x in raw_rows:
                  b=to_bar(x)
                  if last is not None and b.t<=last:raise ValueError('DUPLICATE_OR_UNSORTED_RAW_ROWS')
                  last=b.t;days[b.t.date()].append(b)
              dm={date.fromisoformat(r['date']):r for r in daily_rows}
              audits=[];infos={};pct=10 if board in ('SH_MAIN','SZ_MAIN') else 20
              prev_close=None
              for d in calendar:
                  rows=days.get(d,[]);r=dm.get(d)
                  z={'symbol':symbol,'date':str(d),'board':board,'rows':len(rows),'positive_volume_rows':sum(b.v>0 for b in rows),'status':'READY_PROXY','issues':'','entry_eligible':False,'source_label_contract':'START_LABEL_ASSUMED_NOT_CERTIFIED'}
                  reasons=[];info={'rows':rows,'ref':None,'up':None,'dn':None,'entry_eligible':False,'paused':False,'failure':None,'corporate_action_gap':False,'daily':r}
                  if r is None:
                      ipo_text=basic.get('ipoDate','')
                      if basic.get('outDate') and d>date.fromisoformat(basic['outDate']):
                          z['status']='AFTER_DELIST_NOT_EXPECTED'
                      elif ipo_text and d<date.fromisoformat(ipo_text):
                          z['status']='PRE_IPO_NOT_EXPECTED'
                      else:
                          reasons.append('NO_DAILY_REFERENCE')
                  else:
                      try:
                          ref=price_cents(r['preclose']);status=str(r['tradestatus']);st=str(r['isST'])
                          if status not in {'0','1'} or st not in {'0','1'}:raise ValueError('UNKNOWN_TRADE_OR_ST_STATUS')
                          day_pct=5 if st=='1' and board in ('SH_MAIN','SZ_MAIN') else pct
                          info.update(ref=ref,up=limit_cents(ref,day_pct),dn=limit_cents(ref,day_pct,False),paused=status!='1')
                          if prev_close is not None and ref!=prev_close:info['corporate_action_gap']=True
                          # This research adapter does not invent dividend cash, split
                          # shares or tax payments when an open position crosses a gap.
                          p=[b for b in rows if b.v>0]
                          z.update(reference_cents=ref,st_flag=st,paused=info['paused'],corporate_action_gap=info['corporate_action_gap'])
                          if not info['paused']:
                              if not rows or not p:reasons.append('NO_TRADING_MINUTES')
                              if rows:
                                  clock=[b.t.strftime('%H:%M') for b in rows]
                                  expected=[(datetime.combine(d,datetime.min.time())+timedelta(minutes=m)).strftime('%H:%M') for m in list(range(570,691))+list(range(781,901))]
                                  z['observed_source_grid']='09:30_POINT_PLUS_09:31_TO_11:30_AND_13:01_TO_15:00'
                                  if clock!=expected:reasons.append('MINUTE_GRID_INCOMPLETE')
                              if p:
                                  agg=[p[0].o,max(b.h for b in p),min(b.l for b in p),p[-1].c]
                                  dailyprice=[price_cents(r[k]) for k in ['open','high','low','close']]
                                  for k,a,e in zip(['open','high','low','close'],agg,dailyprice):z[k+'_delta_cents']=a-e
                                  if agg!=dailyprice:reasons.append('POSITIVE_VOLUME_OHLC_MISMATCH')
                                  if r.get('volume'):
                                      vd=sum(b.v for b in rows)-int(Decimal(r['volume']));z['volume_delta_raw_units']=vd
                                      # Retain, report, do NOT scale to fabricate matching totals.
                                      if vd:z['volume_warning']='VENDOR_VOLUME_DIFFERENCE_NO_CAPACITY_CERTIFICATION'
                              ipoflag=ipo_window(basic.get('ipoDate',''),board,d,calendar)
                              z['ipo_no_limit_window']=ipoflag
                              if ipoflag is None:reasons.append('IPO_CALENDAR_UNRESOLVED')
                              # Never discard historical days merely because a company later delists.
                              out_date=basic.get('outDate','')
                              if out_date and d>date.fromisoformat(out_date):
                                  reasons.append('AFTER_RECORDED_DELIST_DATE')
                              if st=='0' and ipoflag is False and p:
                                  breach=any(b.h>info['up'] or b.l<info['dn'] for b in p)
                                  z['cent_limit_breach']=breach
                                  if breach:reasons.append('CANDIDATE_LIMIT_BREACH')
                              info['entry_eligible']=st=='0' and ipoflag is False and not reasons
                          prev_close=price_cents(r['close'])
                      except Exception as e:reasons.append('DAILY_PARSE_ERROR:'+str(e));prev_close=None
                  if reasons:
                      info['failure']='|'.join(reasons);z['status']='DATA_QUARANTINE_NOT_NO_SIGNAL'
                  elif info['paused']:z['status']='SUSPENDED'
                  elif not info['entry_eligible'] and z['status'] not in {'PRE_IPO_NOT_EXPECTED','AFTER_DELIST_NOT_EXPECTED'}:z['status']='STRATEGY_OR_IPO_EXCLUDED'
                  z['entry_eligible']=info['entry_eligible'];z['issues']='|'.join(reasons)
                  infos[d]=info;audits.append(z)
              return infos,audits

          def signal(rows,v,r,u):
              for i,b in enumerate(rows):
                  if b.v<=0 or not phase(b.t):continue
                  bands=band(v,r,u,b.t)
                  if bands is None:continue
                  lo=max(bands[0],b.l);hi=min(bands[1],b.h)
                  if lo<=hi:
                      p=max(lo,min(b.o,hi))
                      return i,p
              return None

          def fill(rows,i,v,r,u,mode):
              if i+1>=len(rows):return None,'NO_NEXT_BAR'
              a,b=rows[i],rows[i+1]
              if b.t-a.t!=timedelta(minutes=1) or phase(a.t)!=phase(b.t) or not phase(b.t):return None,'NO_CONTIGUOUS_NEXT_MINUTE'
              if b.v<=0:return None,'ZERO_VOLUME_NEXT_MINUTE'
              if b.o>=u:return None,'NEXT_OPEN_AT_LIMIT'
              limits=band(v,r,u,b.t)
              if mode=='NEXT_OPEN_RECHECK' and (limits is None or not limits[0]<=b.o<=limits[1]):return None,'NEXT_OPEN_FILTER_FAIL'
              return b,None

          def exit_bar(b,entry,up,dn,path,eod_mode):
              if b.v<=0 or not phase(b.t):return None,None
              tp=(entry*105+99)//100;sl=entry*95//100
              if b.o<=sl:
                  return (None,'STOP_OPEN_LIMIT_UNRESOLVED') if b.o<=dn else ((b.o,'STOP_GAP_OPEN','BAR_OPEN'),None)
              if b.o>=tp:
                  if b.o>=up:return None,'TP_OPEN_LIMIT_WAIT_NEXT_BAR'
                  return (b.o,'TAKE_PROFIT_GAP_OPEN','BAR_OPEN'),None
              # Fixed-time orders must not use the future H/L of the 14:55 bar first.
              if b.t.hour*60+b.t.minute>=895 and eod_mode=='EOD_OPEN':
                  if dn<b.o<up:return (b.o,'EOD_OPEN_PROXY','BAR_OPEN'),None
                  return None,'EOD_OPEN_AT_LIMIT_WAIT_NEXT_BAR'
              hs=b.l<=sl;ht=b.h>=tp
              if hs and sl<=dn:return None,'STOP_TOUCH_LIMIT_UNRESOLVED'
              if ht and tp>=up:ht=False
              if hs and ht:return ((sl,'BOTH_HIT_STOP_FIRST','WITHIN_BAR') if path=='STOP_FIRST' else (tp,'BOTH_HIT_TP_FIRST','WITHIN_BAR')),None
              if hs:return (sl,'STOP_TOUCH_PROXY','WITHIN_BAR'),None
              if ht:return (tp,'TP_TOUCH_PROXY','WITHIN_BAR'),None
              if b.t.hour*60+b.t.minute>=895 and eod_mode=='EOD_CLOSE_LEGACY' and dn<b.c<up:
                  return (b.c,'EOD_CLOSE_LEGACY_PROXY','BAR_END'),None
              return None,None

          def scan(symbol,infos,calendar,variants=None,modes=None,paths=None,eod_mode='EOD_OPEN'):
              sigs=[];trades=[];date_index={d:i for i,d in enumerate(calendar)}
              for v in (variants or VARIANTS):
                for mode in (modes or ['NEXT_OPEN_RECHECK','NEXT_OPEN_MARKET']):
                 for path in (paths or ['STOP_FIRST','TP_FIRST']):
                  blocked_until=None
                  for d in calendar:
                      if not START<=d<=END:continue
                      a=infos[d]
                      if not a['entry_eligible']:continue
                      first=signal(a['rows'],v,a['ref'],a['up'])
                      if first is None:continue
                      i,sp=first;sr={'symbol':symbol,'variant':v,'fill_mode':mode,'path':path,'eod_mode':eod_mode,'signal_date':str(d),'signal_time':a['rows'][i].t.isoformat(' '),'signal_price':sp/100,'signal_gain':sp/a['ref']-1,'signal_distance':a['up']/sp-1,'status':'CANDIDATE','official_pit_certified':False}
                      if blocked_until is not None and d<=blocked_until:
                          sr['status']='EXISTING_OR_UNRESOLVED_POSITION';sigs.append(sr);continue
                      fb,reason=fill(a['rows'],i,v,a['ref'],a['up'],mode)
                      if fb is None:sr['status']=reason;sigs.append(sr);continue
                      sr.update(status='FILLED_PROXY',entry_time=fb.t.isoformat(' '),entry_price=fb.o/100,entry_gain=fb.o/a['ref']-1,entry_distance=a['up']/fb.o-1)
                      sigs.append(dict(sr));tr=dict(sr);entry=fb.o;found=None;unresolved=None;bc=sc=0
                      tr['t_day_touched_up']=any(b.h>=a['up'] and b.v>0 for b in a['rows'][i+1:]);tr['t_day_close_at_up']=a['rows'][-1].c==a['up']
                      tr['exit_time']=None;tr['exit_price']=None;tr['gross_return']=None;tr['net_return_20bp']=None
                      t1=None
                      for xd in calendar[date_index[d]+1:]:
                          a2=infos[xd]
                          if t1 is None:t1=xd
                          if a2['corporate_action_gap']:
                              unresolved='CORPORATE_ACTION_CASH_SHARE_BRIDGE_MISSING';break
                          if a2['failure']:
                              unresolved='HELD_PATH_DATA_GAP:'+a2['failure'];break
                          if a2['paused']:continue
                          for b in a2['rows']:
                              dec,state=exit_bar(b,entry,a2['up'],a2['dn'],path,eod_mode)
                              if state and 'STOP' in state:bc+=1
                              if state and 'TP' in state:sc+=1
                              if dec is not None:
                                  xp,why,when=dec
                                  found=(b,xp,why,when);break
                          if found:break
                      if found:
                          b,xp,why,when=found
                          tr.update(exit_time=b.t.isoformat(' '),exit_price=xp/100,exit_reason=why,exit_timing=when,gross_return=xp/entry-1,net_return_20bp=xp/entry-1-.002,status='RESOLVED_RESEARCH_PROXY')
                          blocked_until=b.t.date()
                      else:
                          tr.update(exit_reason=unresolved or 'RIGHT_CENSORED_AT_BUFFER_END',status='UNRESOLVED_KEEP_POSITION')
                          blocked_until=calendar[-1]
                      tr.update(blocked_stop_bars=bc,suppressed_takeprofit_bars=sc)
                      if t1 is not None:
                          d1=infos[t1]
                          if not d1['failure'] and not d1['corporate_action_gap'] and d1['daily']:
                              tr['t1_close_return_proxy']=price_cents(d1['daily']['close'])/entry-1
                      trades.append(tr)
              return sigs,trades

          def summarize(trades):
              groups=defaultdict(list)
              for r in trades:groups[(r['variant'],r['fill_mode'],r['path'],r['eod_mode'])].append(r)
              out=[]
              for key,items in sorted(groups.items()):
                resolved=[r for r in items if r.get('gross_return') is not None]
                for cost in COSTS:
                  vals=[r['gross_return']-cost/10000 for r in resolved]
                  row=dict(zip(['variant','fill_mode','path','eod_mode'],key));row.update(cost_bp=cost,total_positions=len(items),resolved=len(vals),unresolved=len(items)-len(vals),interpretation='CONDITIONAL_PILOT_NOT_FULL_A_OR_ALPHA')
                  if vals:
                      pos=sum(x for x in vals if x>0);neg=-sum(x for x in vals if x<0)
                      row.update(win_rate=sum(x>0 for x in vals)/len(vals),mean_net=statistics.mean(vals),median_net=statistics.median(vals),profit_factor=pos/neg if neg else None,worst=min(vals),best=max(vals))
                  out.append(row)
              return out
          R5B_SRC_R5B_ENGINE_PY_EOF
          cat > bundle/src/r5b_master.py <<'R5B_SRC_R5B_MASTER_PY_EOF'
          """One-entry R5B research runner. Public data only; no orders, no fitted thresholds.
          All source files enter a deterministic inventory. Missing references stay missing.
          A complete processing ledger is NOT certification of full-A coverage or profits.
          """
          from __future__ import annotations
          import argparse,csv,gzip,hashlib,io,json,os,re,shutil,socket,sqlite3,subprocess,sys,time,traceback
          from pathlib import Path
          from datetime import date,datetime,timedelta
          from collections import defaultdict,Counter
          import r5b_engine as E
          VERSION='R5B-MASTER-1.0-RC-20260919'
          BASE=Path(__file__).resolve().parent
          BOARDS=('SH_MAIN','SZ_MAIN','CHINEXT','STAR','BSE')
          COSTS=(0,10,20,30,50)

          def read_csv(path):
              with Path(path).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def atomic_json(path,obj):
              path=Path(path);path.parent.mkdir(parents=True,exist_ok=True);tmp=path.with_suffix(path.suffix+'.tmp')
              with tmp.open('w',encoding='utf-8') as f:json.dump(obj,f,ensure_ascii=False,separators=(',',':'),allow_nan=False,default=str)
              tmp.replace(path)
          def gz_json(path,obj):
              path=Path(path);path.parent.mkdir(parents=True,exist_ok=True);tmp=path.with_suffix('.tmp')
              with gzip.GzipFile(filename=str(tmp),mode='wb',mtime=0) as f:f.write(json.dumps(obj,ensure_ascii=False,separators=(',',':'),allow_nan=False,default=str).encode())
              tmp.replace(path)
          def load_gz(path):
              with gzip.open(path,'rt',encoding='utf-8') as f:return json.load(f)
          def seed_data():return load_gz(BASE/'market_seed.json.gz')
          def csv_text_rows(text):return list(csv.DictReader(io.StringIO(text)))
          def sha(path):return E.digest(path)
          def engine_sha():return sha(BASE/'r5b_engine.py')
          def symbol_key(r):return r['exchange']+'_'+r['symbol']
          def validate_range(start,end,shards):
              if not 2023<=start<=end<=2025:raise ValueError('SUPPORTED_RULE_YEARS_ARE_2023_TO_2025')
              if not 1<=shards<=128:raise ValueError('SHARDS_MUST_BE_1_TO_128')
          def code_key(code):
              if not re.fullmatch(r'(sh|sz|bj)\.\d{6}',code):raise ValueError('BAD_VENDOR_CODE')
              a,b=code.split('.');return a.upper()+'_'+b

          def rs_rows(rs):
              if rs.error_code!='0':raise RuntimeError(str(rs.error_code)+':'+str(rs.error_msg))
              out=[]
              while rs.next():out.append(dict(zip(rs.fields,rs.get_row_data())))
              if rs.error_code!='0':raise RuntimeError(str(rs.error_code)+':'+str(rs.error_msg))
              return out

          def child_request(args):
              """Separate process prevents one stuck socket from killing a complete shard."""
              import baostock as bs
              socket.setdefaulttimeout(25);out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
              errors=[];data={};logged=False
              try:
                  lg=bs.login()
                  if lg.error_code!='0':raise RuntimeError(lg.error_msg)
                  logged=True
                  if args.kind=='security':
                      code=args.code;code_key(code)
                      for key,fn in [
                          ('basic',lambda:bs.query_stock_basic(code=code)),
                          ('daily',lambda:bs.query_history_k_data_plus(code,'date,code,open,high,low,close,preclose,volume,amount,adjustflag,tradestatus,isST',start_date=args.start,end_date=args.end,frequency='d',adjustflag='3'))]:
                          try:data[key]=rs_rows(fn());atomic_json(out/'partial.json',data)
                          except Exception as e:errors.append({'step':key,'error':repr(e)})
                  # Failure of the calendar request MUST NOT erase downloaded daily rows.
                  try:data['calendar']=rs_rows(bs.query_trade_dates(start_date=args.start,end_date=args.end))
                  except Exception as e:errors.append({'step':'calendar','error':repr(e)})
              except Exception as e:errors.append({'step':'login','error':repr(e)})
              finally:
                  if logged:
                      try:bs.logout()
                      except Exception:pass
                  data.update(errors=errors,provider='BaoStock',query_start=args.start,query_end=args.end,retrieved_utc=datetime.utcnow().isoformat()+'Z')
                  atomic_json(out/'response.json',data)
              return 0 if data.get('calendar') or data.get('daily') else 2

          def request_daily(kind,out,start,end,code='',attempts=3,sleep=time.sleep):
              out=Path(out);out.mkdir(parents=True,exist_ok=True);responses=[]
              for attempt in range(attempts):
                  ad=out/f'attempt_{attempt+1}';ad.mkdir(exist_ok=True)
                  cmd=[sys.executable,str(Path(__file__).resolve()),'child','--kind',kind,'--out',str(ad),'--start',start,'--end',end]
                  if code:cmd+=['--code',code]
                  try:
                      cp=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=100)
                      (ad/'request.log').write_text(cp.stdout,encoding='utf-8')
                  except subprocess.TimeoutExpired as e:
                      (ad/'request.log').write_text('TIMEOUT_NOT_ZERO_ROWS\n'+str(e.stdout or '')[-2000:],encoding='utf-8')
                  rp=ad/'response.json'
                  if rp.exists():r=json.loads(rp.read_text());responses.append(r)
                  elif (ad/'partial.json').exists():r=json.loads((ad/'partial.json').read_text());r['errors']=[{'step':'child','error':'TIMEOUT_WITH_PARTIAL_INPUT'}];responses.append(r)
                  else:r={}
                  if (kind=='calendar' and r.get('calendar')) or (kind=='security' and r.get('daily') and r.get('basic')):return r
                  if attempt+1<attempts:sleep(min(15,3*(2**attempt)))
              # Keep the most informative returned result, not just the last empty response.
              return max(responses,key=lambda x:len(x.get('daily',[]))+bool(x.get('basic',[])),default={'errors':[{'step':'child','error':'NO_USABLE_RESPONSE'}]})

          def merge_rows(old,new,key='date'):
              for batch in (old,new):
                  if len({r[key] for r in batch})!=len(batch):raise ValueError('DUPLICATE_VENDOR_DATES:'+key)
              out={r[key]:r for r in old};diff=[]
              for r in new:
                  k=r[key]
                  if k in out and any(str(out[k].get(f,''))!=str(r.get(f,'')) for f in ('open','high','low','close','preclose','isST','tradestatus') if f in r):diff.append(k)
                  out[k]=r
              return [out[k] for k in sorted(out)],diff

          def calendar_segment(rows,contract):
              """Never leap over an unknown calendar date as if no trading occurred."""
              if len({r['calendar_date'] for r in rows})!=len(rows):raise ValueError('DUPLICATE_CALENDAR_DATE')
              if any(str(r.get('is_trading_day')) not in {'0','1'} for r in rows):raise ValueError('UNKNOWN_CALENDAR_STATUS')
              byday={date.fromisoformat(r['calendar_date']):r for r in rows}
              lo=date.fromisoformat(contract['warmup']);hi=date.fromisoformat(contract['buffer_end'])
              first=date.fromisoformat(contract['start']);last=date.fromisoformat(contract['end'])
              all_days=[lo+timedelta(days=i) for i in range((hi-lo).days+1)]
              present=[d for d in all_days if d in byday]
              if not present:return [],{'calendar_missing_days':len(all_days),'calendar_target_complete':False}
              # Use the segment containing target start; otherwise earliest known segment
              # intersecting the target. Later islands are quarantined, never spliced.
              anchor=first if first in byday else next((d for d in present if first<=d<=last),present[0])
              a=b=anchor
              while a>lo and a-timedelta(days=1) in byday:a-=timedelta(days=1)
              while b<hi and b+timedelta(days=1) in byday:b+=timedelta(days=1)
              usable=[byday[d] for d in present if a<=d<=b]
              complete=a<=first and b>=last
              return usable,{'calendar_coverage_start':str(a),'calendar_coverage_end':str(b),'calendar_missing_days':sum(d not in byday for d in all_days),'calendar_target_complete':complete,'calendar_gap_policy':'FIRST_CONTIGUOUS_KNOWN_SEGMENT_ONLY'}

          def build_plan(out,first,last,nshards,online=True):
              validate_range(first,last,nshards);out=Path(out);out.mkdir(parents=True,exist_ok=True)
              s=seed_data();lock=json.loads(s['dataset_lock.json']);inventory=csv_text_rows(s['inventory.csv'])
              keys=[symbol_key(r) for r in inventory]
              if len(keys)!=len(set(keys)) or len(inventory)!=lock['security_files']:raise ValueError('INVENTORY_IDENTITY_OR_COUNT_MISMATCH')
              for r in inventory:
                  if r['board'] not in BOARDS or not re.fullmatch(r'data/stock_1m/(SH|SZ|BJ)/\d{6}\.parquet',r['path']):raise ValueError('BAD_INVENTORY_PATH')
              inventory=sorted(inventory,key=lambda r:hashlib.sha256(r['path'].encode()).hexdigest())
              for i,r in enumerate(inventory):r['shard']=i%nshards
              warm=f'{first-1}-12-01';buffer=f'{last+1}-01-31'
              cal=csv_text_rows(s['baostock_trade_calendar.csv']);result={}
              if online:
                  result=request_daily('calendar',out/'calendar_attempts',warm,buffer)
                  cal,_=merge_rows(cal,result.get('calendar',[]),key='calendar_date')
              years=sorted({int(r['calendar_date'][:4]) for r in cal if r['is_trading_day']=='1'})
              contract={'version':VERSION,'first_year':first,'last_year':last,'start':f'{first}-01-01','end':f'{last}-12-31','warmup':warm,'buffer_end':buffer,'shards':nshards,'inventory_files':len(inventory),'repository':lock['repo'],'revision':lock['revision_sha'],'engine_sha256':engine_sha(),'source_sha256':sha(__file__),'calendar_years_available':years,'full_a_certified':False,'no_parameter_training':True,'raw_tick_execution_certified':False,'reference_source':'BaoStock plus versioned public Phase2 seed','seed_provenance':s['provenance'],'universe':'FIXED_DATASET_INVENTORY_NOT_OFFICIAL_DYNAMIC_FULL_A','primary':['NEXT_OPEN_RECHECK','STOP_FIRST','EOD_OPEN','20bp'],'heat_factor_exact':False,'raw_retention':'compact final by default; native files are re-downloadable by immutable revision and hash'}
              contract['contract_sha256']=hashlib.sha256(json.dumps(contract,sort_keys=True).encode()).hexdigest()
              atomic_json(out/'contract.json',contract);atomic_json(out/'inventory.json',inventory);atomic_json(out/'calendar.json',cal)
              E.write_rows(out/'inventory.csv',inventory)
              atomic_json(out/'matrix.json',{'shard':list(range(nshards))})
              return contract

          def download_raw(rec,contract,cache,retries=3):
              from huggingface_hub import hf_hub_download
              import pyarrow as pa,pyarrow.compute as pc,pyarrow.parquet as pq
              errs=[];local=None
              for k in range(retries):
                  try:
                      local=Path(hf_hub_download(repo_id=contract['repository'],filename=rec['path'],repo_type='dataset',revision=contract['revision'],cache_dir=str(cache),token=False));break
                  except Exception as e:
                      errs.append(repr(e))
