              seed_basic={code_key(r['code']):r for r in csv_text_rows(s['baostock_basic.csv'])}
              calendar=json.loads((plan/'calendar.json').read_text());cache=Path(args.cache);cache.mkdir(parents=True,exist_ok=True)
              outfiles=out/'symbols';outfiles.mkdir(exist_ok=True);statuses=[];started=time.monotonic();failstreak=0;nextprobe=0;retry_keys=[]
              def save(rec,obj):
                  obj.update(symbol=symbol_key(rec),board=rec['board'],contract_sha256=c['contract_sha256'],processing_finished=True)
                  gz_json(cache/(symbol_key(rec)+'.json.gz'),obj)
                  gz_json(outfiles/(symbol_key(rec)+'.json.gz'),obj)
