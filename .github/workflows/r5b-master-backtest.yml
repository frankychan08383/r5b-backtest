                          if checkpoint_valid(old,c,key) and not args.retain_raw:save(rec,old);continue
                      except Exception:pass
                  if time.monotonic()-started>args.budget_seconds:
                      save(rec,{'status':'TIME_BUDGET_NOT_ATTEMPTED','retryable':True,'raw_rows':None});retry_keys.append(key);continue
                  t=time.monotonic();obj={'status':'STARTED','retryable':False};raw=[]
                  try:
                      raw,meta=download_raw(rec,c,out/'native_cache');obj['source']=meta
                      obj['raw_rows']=len(raw);target=[r for r in raw if c['start']<=r['timestamp'][:10]<=c['end']]
                      obj['target_rows']=len(target);obj['target_days']=len({r['timestamp'][:10] for r in target})
                      if args.retain_raw:
                          dest=out/'raw_minutes'/(key+'.csv.gz');dest.parent.mkdir(exist_ok=True)
                          with gzip.open(dest,'wt',encoding='utf-8',newline='') as f:
                              cols=list(raw[0]) if raw else ['timestamp','open','high','low','close','volume'];w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(raw)
                      if rec['board']=='BSE':
                          obj.update(status='BSE_RAW_RETRIEVED_REFERENCE_ID_BRIDGE_UNRESOLVED',retryable=False)
