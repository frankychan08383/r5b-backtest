      - name: Install dependencies and run execution plus orchestration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --retries 4 -r bundle/src/requirements.txt
          python -m pip freeze > bundle/DEPENDENCIES_USED.txt
          PYTHONPATH=bundle/src python -m unittest discover -s bundle/tests -v 2>&1 | tee bundle/TESTS.log
      - name: Lock full universe and date window (calendar failures use saved references, never erase data)
        id: plan
        shell: bash
        env:
          FIRST: ${{ inputs.first_year }}
          LAST: ${{ inputs.last_year }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python bundle/src/r5b_master.py plan --out bundle/plan --first "$FIRST" --last "$LAST" --shards "$SHARDS" 2>&1 | tee bundle/PLAN.log
          python - <<'PY_OUTPUTS'
          import json,os
          from pathlib import Path
          root=Path('bundle/plan')
          matrix=json.loads((root/'matrix.json').read_text())
          c=json.loads((root/'contract.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
              f.write('contract='+c['contract_sha256']+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# R5B full inventory plan\n\n'+str(c['inventory_files'])+' files; '+c['start']+' through '+c['end']+'. No sample cap.\n\nNo HF token. All performance remains research-only.\n')
          PY_OUTPUTS
      - name: Keep source, fixed inventory and any setup failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-CODE-${{ github.run_id }}
          path: bundle/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Explain a setup failure in a FINAL artifact too
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p setup_failed_FINAL
          cp -r bundle/. setup_failed_FINAL/ 2>/dev/null || true
          printf '%s\n' '# R5B setup did not complete' 'No market backtest completed. Check the prepare job log and this source bundle.' > setup_failed_FINAL/REPORT.md
      - name: Upload setup failure as the final result, not an empty success
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-FINAL-${{ inputs.first_year }}-${{ inputs.last_year }}-${{ github.run_id }}
          path: setup_failed_FINAL/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  replay:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      RAW: ${{ inputs.retain_raw }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: R5B-MASTER-CODE-${{ github.run_id }}
          path: bundle/
      - name: Prepare durable evidence folders
        run: mkdir -p result/symbols checkpoints
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --retries 4 -r bundle/src/requirements.txt
          python -m pip freeze > result/DEPENDENCIES_USED.txt
      - name: Restore matching per-stock checkpoints (no private account data)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: checkpoints/
          key: r5b-master-${{ needs.prepare.outputs.contract }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r5b-master-${{ needs.prepare.outputs.contract }}-${{ matrix.shard }}-
      - name: Process every assigned security and automatically retry unfinished work once
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXTRA=()
          if [ "$RAW" = "true" ]; then EXTRA+=(--retain-raw); fi
          python bundle/src/r5b_master.py shard --plan bundle/plan --out result --cache checkpoints --shard "$SHARD" --budget-seconds 9000 "${EXTRA[@]}" 2>&1 | tee result/RUN_FIRST.log
          FIRST_RC=${PIPESTATUS[0]}
          FINAL_RC=$FIRST_RC
          if [ "$FIRST_RC" -ne 0 ]; then
            sleep 30
            python bundle/src/r5b_master.py shard --plan bundle/plan --out result --cache checkpoints --shard "$SHARD" --budget-seconds 6000 "${EXTRA[@]}" 2>&1 | tee result/RUN_RETRY.log
            FINAL_RC=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$FINAL_RC" > result/PROCESS_EXIT_CODE.txt
          exit "$FINAL_RC"
      - name: Save checkpoints even after a provider or runtime failure
        if: ${{ always() && steps.restore.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: checkpoints/
          key: r5b-master-${{ needs.prepare.outputs.contract }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain this shard's success AND failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-PART-${{ github.run_id }}-${{ matrix.shard }}
          path: result/
          overwrite: true
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  collect:
    needs: [prepare, replay]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: R5B-MASTER-CODE-${{ github.run_id }}
          path: bundle/
      - name: Create final even if some shards are missing
        run: mkdir -p parts FINAL/SOURCE_USED
      - name: Download available shard results without silently overwriting duplicate securities
        id: parts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: R5B-MASTER-PART-${{ github.run_id }}-*
          path: parts/
          merge-multiple: false
      - name: Install statistics dependency
        run: python -m pip install --retries 4 numpy==1.26.4
      - name: Produce one complete accounting report and merged event ledgers
        shell: bash
        run: |
          set -euo pipefail
          cp bundle/src/r5b_*.py bundle/src/requirements.txt bundle/src/market_seed.json.gz FINAL/SOURCE_USED/
          python bundle/src/r5b_master.py collect --plan bundle/plan --parts parts --out FINAL 2>&1 | tee FINAL/COLLECT.log
      - name: Publish explicit completeness and research limitations
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY_MANIFEST'
          import hashlib,json,os
          from pathlib import Path
          p=Path('FINAL');p.mkdir(exist_ok=True)
          info={'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'workflow_commit':os.environ['GITHUB_SHA'],'full_a_certified':False}
          (p/'GITHUB_RUN.json').write_text(json.dumps(info,indent=2))
          sizes={str(f.relative_to(p)):f.stat().st_size for f in p.rglob('*') if f.is_file() and f.name not in ['FILE_SIZES.json','MANIFEST_SHA256.json']}
          (p/'FILE_SIZES.json').write_text(json.dumps(sizes,indent=2))
          hashes={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f.name!='MANIFEST_SHA256.json'}
          (p/'MANIFEST_SHA256.json').write_text(json.dumps(hashes,indent=2))
          report=(p/'REPORT.md').read_text() if (p/'REPORT.md').exists() else '# R5B collector failed\nRead COLLECT.log. No full-market result has been certified.'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(report+'\n\nDownload R5B-MASTER-FINAL, not each PART. Results retain one day.\n')
          PY_MANIFEST
      - name: Upload the single final result package (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-FINAL-${{ inputs.first_year }}-${{ inputs.last_year }}-${{ github.run_id }}
          path: FINAL/
          overwrite: true
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
