                      else:
                          fresh={};bd=cache/(key+'.daily.json')
                          cached=json.loads(bd.read_text()) if bd.exists() else {}
                          enough=cached.get('query_start','9999')<=c['warmup'] and cached.get('query_end','0000')>=c['buffer_end'] and cached.get('daily') and cached.get('basic')
                          if enough:fresh=cached
                          elif failstreak<3 or time.monotonic()>=nextprobe:
                              fresh=request_daily('security',out/'attempt_logs'/key,c['warmup'],c['buffer_end'],rec['exchange'].lower()+'.'+rec['symbol'],attempts=2)
                              if fresh.get('daily') and fresh.get('basic'):
                                  failstreak=0;atomic_json(bd,fresh)
                              else:failstreak+=1;nextprobe=time.monotonic()+120
                          else:fresh={'errors':[{'step':'circuit_breaker','error':'PROVIDER_UNAVAILABLE_REPROBE_AFTER_120_SECONDS'}]}
                          daily,diffs=merge_rows(seed_daily.get(key,[]),fresh.get('daily',[]));basic=(fresh.get('basic') or [seed_basic.get(key,{})])[0]
                          localcal,_=merge_rows(calendar,fresh.get('calendar',[]),key='calendar_date')
                          obj.update(daily=daily,basic=basic,attempts=fresh.get('errors',[]),daily_source_revision_diff_dates=diffs,seed_fallback=not bool(fresh.get('daily')))
                          if not daily or not basic:
                              obj.update(status='DAILY_REFERENCE_UNAVAILABLE_NOT_NO_SIGNAL',retryable=True);retry_keys.append(key)
                          else:
                              res=replay_one(rec,raw,daily,basic,localcal,c);obj.update(res)
                              yr_avail={int(r['date'][:4]) for r in daily};years=expected_reference_years(basic,c);missing=sorted(years-yr_avail)
                              obj.update(status='REPLAYED_CONDITIONAL_RESEARCH',reference_years_available=sorted(yr_avail),missing_reference_years=missing,eligible_days=sum(a['entry_eligible'] and c['start']<=a['date']<=c['end'] for a in res['day_audit']),quarantined_target_days=sum(a['status']=='DATA_QUARANTINE_NOT_NO_SIGNAL' and c['start']<=a['date']<=c['end'] for a in res['day_audit']),scenario_positions=len(res['trades']),unresolved=sum(r['gross_return'] is None for r in res['trades']),retryable=bool(missing or not res['calendar_audit']['calendar_target_complete']))
                              no_daily=[a['date'] for a in res['day_audit'] if c['start']<=a['date']<=c['end'] and 'NO_DAILY_REFERENCE' in a.get('issues','')]
                              if no_daily:obj.update(missing_daily_dates=no_daily,retryable=True)
