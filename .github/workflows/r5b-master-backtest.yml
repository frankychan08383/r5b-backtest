                      obj['elapsed_seconds']=round(time.monotonic()-t,3);save(rec,obj);shutil.rmtree(out/'native_cache',ignore_errors=True)
                      print(key,obj['status'],obj.get('target_rows'),obj.get('scenario_positions'),flush=True)
              atomic_json(out/'retry_symbols.json',retry_keys)
              summary={'shard':args.shard,'contract_sha256':c['contract_sha256'],'expected':len(items),'processed_ledger':len(statuses),'retryable':len(retry_keys),'statuses':dict(Counter(r['status'] for r in statuses)),'full_a_certified':False}
              atomic_json(out/'SUMMARY.json',summary)
              # Return after evidence is written; workflow uploads even on this failure.
              return 2 if retry_keys else 0

          def conditional_stats(items,cost):
              import numpy as np
              resolved=[r for r in items if r.get('gross_return') is not None]
              a=np.array([r['gross_return']-cost/10000 for r in resolved],dtype=float)
              z={'positions':len(items),'resolved':len(resolved),'unresolved':len(items)-len(resolved),'cost_bp':cost,'interpretation':'RESOLVED_CONDITIONAL_NOT_FULL_POPULATION','mean_net':None,'win_rate':None,'median_net':None,'profit_factor':None,'worst':None,'best':None,'mean_excluding_top_1pct':None}
              if not len(a):return z
              neg=-a[a<0].sum();cut=max(1,int(len(a)*.01))
              z.update(mean_net=float(a.mean()),win_rate=float((a>0).mean()),median_net=float(np.median(a)),profit_factor=float(a[a>0].sum()/neg) if neg else None,worst=float(a.min()),best=float(a.max()),mean_excluding_top_1pct=float(np.sort(a)[:-cut].mean()) if len(a)>cut else None)
              return z

          def bootstrap_days(items,cost=20,reps=2000):
              import numpy as np
              days=defaultdict(list)
              for r in items:
                  if r.get('gross_return') is not None:days[r['signal_date']].append(r['gross_return']-cost/10000)
              if len(days)<20:return {'entry_day_clusters':len(days),'bootstrap_lo':None,'bootstrap_hi':None,'bootstrap_status':'TOO_FEW_DATE_CLUSTERS'}
              x=np.array([[sum(v),len(v)] for k,v in sorted(days.items())]);rng=np.random.default_rng(20260919);vals=[]
              for _ in range(0,reps,100):
                  idx=rng.integers(0,len(x),(min(100,reps-len(vals)),len(x)));sample=x[idx].sum(axis=1);vals.extend((sample[:,0]/sample[:,1]).tolist())
              lo,hi=np.quantile(vals,[.025,.975]);return {'entry_day_clusters':len(days),'bootstrap_lo':float(lo),'bootstrap_hi':float(hi),'bootstrap_status':'CLUSTERED_BY_ENTRY_DAY_NOT_ALPHA_CERTIFICATION'}

          def collect(args):
              # The full universe is too large to retain millions of Python trade dicts.
              # Stream each security to compressed CSV and use disk-backed SQLite to group.
              from contextlib import ExitStack
              plan=Path(args.plan);out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
              c=json.loads((plan/'contract.json').read_text());inv=json.loads((plan/'inventory.json').read_text());expected={symbol_key(r) for r in inv}
              found={};duplicate=[]
              for f in Path(args.parts).rglob('*.json.gz'):
                  if f.parent.name!='symbols':continue
                  obj=load_gz(f);key=obj.get('symbol')
                  if key not in expected or obj.get('contract_sha256')!=c['contract_sha256']:raise ValueError('ALIEN_SYMBOL_OR_CONTRACT_IN_RESULTS:'+str(f))
                  if key in found:
                      if load_gz(found[key])!=obj:raise ValueError('CONFLICTING_DUPLICATE_RESULT:'+key)
                      duplicate.append(key)
                  found[key]=f
              dbpath=out/'statistics.sqlite.tmp'
              if dbpath.exists():dbpath.unlink()
              db=sqlite3.connect(dbpath)
              db.execute('CREATE TABLE tr(variant TEXT,fill_mode TEXT,path TEXT,eod_mode TEXT,signal_date TEXT,board TEXT,gross_return REAL,entry_gain REAL,entry_distance REAL)')
              statuses=[];raw_total=0
              trade_fields=['symbol','board','variant','fill_mode','path','eod_mode','signal_date','signal_time','signal_price','signal_gain','signal_distance','status','entry_time','entry_price','entry_gain','entry_distance','exit_time','exit_price','exit_reason','exit_timing','gross_return','net_return_20bp','t_day_touched_up','t_day_close_at_up','t1_close_return_proxy','blocked_stop_bars','suppressed_takeprofit_bars','official_pit_certified','sample_status']
              signal_fields=[x for x in trade_fields if x not in ('exit_time','exit_price','exit_reason','exit_timing','gross_return','net_return_20bp','t_day_touched_up','t_day_close_at_up','t1_close_return_proxy','blocked_stop_bars','suppressed_takeprofit_bars')]
              with ExitStack() as stack:
                tf=stack.enter_context(gzip.open(out/'trades.csv.gz','wt',encoding='utf-8-sig',newline=''))
                sf=stack.enter_context(gzip.open(out/'signals.csv.gz','wt',encoding='utf-8-sig',newline=''))
                inf=stack.enter_context(gzip.open(out/'daily_inputs_and_audit.jsonl.gz','wt',encoding='utf-8'))
                tw=csv.DictWriter(tf,fieldnames=trade_fields,extrasaction='raise');sw=csv.DictWriter(sf,fieldnames=signal_fields,extrasaction='raise');tw.writeheader();sw.writeheader()
                for key in sorted(expected):
                  obj=load_gz(found[key]) if key in found else {'symbol':key,'status':'MISSING_SHARD_RESULT','retryable':True,'processing_finished':False}
                  raw_total+=obj.get('target_rows') or 0
                  statuses.append({k:obj.get(k) for k in ['symbol','board','status','target_rows','target_days','eligible_days','scenario_positions','unresolved','retryable','seed_fallback','missing_reference_years']})
                  tw.writerows(obj.get('trades',[]));sw.writerows(obj.get('signals',[]))
                  db.executemany('INSERT INTO tr VALUES(?,?,?,?,?,?,?,?,?)',[(r['variant'],r['fill_mode'],r['path'],r['eod_mode'],r['signal_date'],r['board'],r.get('gross_return'),r.get('entry_gain'),r.get('entry_distance')) for r in obj.get('trades',[])])
                  inf.write(json.dumps({k:v for k,v in obj.items() if k not in ('trades','signals')},ensure_ascii=False,separators=(',',':'),default=str)+'\n')
                db.commit()
              db.execute('CREATE INDEX idx_case ON tr(variant,fill_mode,path,eod_mode)')
              primary="fill_mode='NEXT_OPEN_RECHECK' AND path='STOP_FIRST' AND eod_mode='EOD_OPEN'"
              def get_rows(where,params=()):
                  return [{'gross_return':r[0],'signal_date':r[1]} for r in db.execute('SELECT gross_return,signal_date FROM tr WHERE '+where,params)]
              summaries=[]
              for case in db.execute('SELECT DISTINCT variant,fill_mode,path,eod_mode FROM tr ORDER BY 1,2,3,4').fetchall():
                  rows=get_rows('variant=? AND fill_mode=? AND path=? AND eod_mode=?',case)
                  for cost in COSTS:summaries.append(dict(zip(['variant','fill_mode','path','eod_mode'],case))|conditional_stats(rows,cost))
              E.write_rows(out/'event_summary.csv',summaries)
              annual=[];byboard=[];prim=[]
              for v in E.VARIANTS:
                  rows=get_rows(primary+' AND variant=?',(v,))
                  prim.append({'variant':v}|conditional_stats(rows,20)|bootstrap_days(rows))
                  for y in range(c['first_year'],c['last_year']+1):
