      - name: 运行离线合同测试
        working-directory: kit
        run: python tools/run_tests.py ../offline_test_report.json
      - name: 冻结协议和8组任务
        id: plan
        working-directory: kit
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          python -m portcloud.pipeline plan --out ../run --start "$START_DATE" --end "$END_DATE"
          echo "kit_name=PORT-R24-KIT-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: 保存源码及冻结协议
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.plan.outputs.kit_name }}
          path: |
            bundle/source.zip
            run/*.json
            offline_test_report.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
  collect:
    name: 云端采集分片 ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.freeze.outputs.shards) }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: 取得本轮固定源码
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.freeze.outputs.kit_name }}
          path: .
      - name: 验证并解包代码
        id: unpack
        run: |
          python - <<'PYBOOT'
          import hashlib, pathlib, stat, zipfile
          p=pathlib.Path("bundle/source.zip")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="89d9847e86f43d6b8eb5bd017f80e5bbb57cf258b94d7512ad170e8b61bb45e1", "SOURCE_BUNDLE_HASH_MISMATCH"
          out=pathlib.Path("kit");out.mkdir(exist_ok=True);root=out.resolve()
          with zipfile.ZipFile(p) as z:
              assert sum(x.file_size for x in z.infolist())<5000000, "SOURCE_BUNDLE_TOO_LARGE"
              assert len(z.namelist())==len(set(z.namelist())), "DUPLICATE_ZIP_PATH"
              for x in z.infolist():
                  assert "\\" not in x.filename and (out/x.filename).resolve().is_relative_to(root), "UNSAFE_ZIP_PATH"
                  assert not stat.S_ISLNK(x.external_attr>>16), "ZIP_SYMLINK"
              assert z.testzip() is None, "SOURCE_ZIP_CRC"
              z.extractall(out)
          import sys
          sys.path.insert(0,str(out))
          from portcloud.common import verify_manifest
          assert not verify_manifest(out), "SOURCE_MANIFEST_MISMATCH"
          PYBOOT
      - name: 安装PDF文本提取依赖（失败仍采集原始字节）
        continue-on-error: true
        run: |
          python -m pip install --retries 3 --timeout 30 -r kit/requirements.txt
          python -m pip freeze > run/environment.txt
      - name: 可选恢复上一轮已经保存的数据分片
        if: ${{ inputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: PORT-R24-SHARD-${{ matrix.shard }}-${{ inputs.resume_run_id }}-*
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: previous
          merge-multiple: false
      - name: 分年采集原PDF、目录、原价和事件线索
        id: capture
        timeout-minutes: 100
        working-directory: kit
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m portcloud.pipeline collect --shard "$SHARD" --run ../run --work ../work --previous ../previous
      - name: 无论采集成功与否保存检查点
        if: ${{ always() && steps.unpack.outcome == 'success' }}
        working-directory: kit
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m portcloud.pipeline checkpoint --shard "$SHARD" --run ../run --work ../work --archives ../archives
      - name: 上传本组原件和失败记录
        if: ${{ always() && steps.unpack.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PORT-R24-SHARD-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: archives/*.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
  finalize:
    name: 汇总唯一FINAL与覆盖检查
    needs: [freeze, collect]
    if: ${{ always() && needs.freeze.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: 取得冻结源码
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.freeze.outputs.kit_name }}
          path: .
      - name: 验证并解包代码
        run: |
          python - <<'PYBOOT'
          import hashlib, pathlib, stat, zipfile
          p=pathlib.Path("bundle/source.zip")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="89d9847e86f43d6b8eb5bd017f80e5bbb57cf258b94d7512ad170e8b61bb45e1", "SOURCE_BUNDLE_HASH_MISMATCH"
          out=pathlib.Path("kit");out.mkdir(exist_ok=True);root=out.resolve()
          with zipfile.ZipFile(p) as z:
              assert sum(x.file_size for x in z.infolist())<5000000, "SOURCE_BUNDLE_TOO_LARGE"
              assert len(z.namelist())==len(set(z.namelist())), "DUPLICATE_ZIP_PATH"
              for x in z.infolist():
                  assert "\\" not in x.filename and (out/x.filename).resolve().is_relative_to(root), "UNSAFE_ZIP_PATH"
                  assert not stat.S_ISLNK(x.external_attr>>16), "ZIP_SYMLINK"
              assert z.testzip() is None, "SOURCE_ZIP_CRC"
              z.extractall(out)
          import sys
          sys.path.insert(0,str(out))
          from portcloud.common import verify_manifest
          assert not verify_manifest(out), "SOURCE_MANIFEST_MISMATCH"
          PYBOOT
      - name: 下载本轮全部已上传分片
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: PORT-R24-SHARD-*-${{ github.run_id }}-*
          path: incoming
          merge-multiple: false
      - name: 汇总原件、逐股覆盖、PIT核验队列
        working-directory: kit
        run: |
          python -m portcloud.pipeline merge --run ../run --incoming ../incoming --out ../final
          python -m portcloud.pipeline pack --root ../final --zip "../delivery/PORT-R24-FINAL-${GITHUB_RUN_ID}.zip"
          cp ../final/REPORT.html ../final/RESULT_STATUS.json ../delivery/
      - name: 先交付FINAL（部分来源失败也交付）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PORT-R24-FINAL-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: 最后判定采集是否仍有缺口
        working-directory: kit
        run: python -m portcloud.pipeline assert-collection --result ../final/RESULT_STATUS.json
