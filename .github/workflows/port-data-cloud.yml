# PORT-R24-GITHUB-v1.0.0 | Full Model v1.4
# INSTALL: .github/workflows/port-data-cloud.yml on the DEFAULT branch.
# One manual trigger runs all shards. This is acquisition, NOT a trading system.
# Raw bytes/metadata may need human PIT review. No brokerage secrets or order APIs.
# Read the bundled README for storage/minutes limits before starting.
name: PORT 港口云端数据采集
run-name: PORT-R24 ${{ inputs.start_date }} to ${{ inputs.end_date }}
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期 YYYY-MM-DD'
        required: true
        type: string
        default: '2016-01-01'
      end_date:
        description: '截止日期 YYYY-MM-DD（不要填未来日期）'
        required: true
        type: string
        default: '2026-09-18'
      resume_run_id:
        description: '断点续跑：上一次运行网址中的数字ID；第一次留空'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: port-r24-public-data-${{ github.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  freeze:
    name: 验证源码和冻结采集范围
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      kit_name: ${{ steps.plan.outputs.kit_name }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
