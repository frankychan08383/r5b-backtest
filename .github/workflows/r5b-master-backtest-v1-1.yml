          R5B_B64_EOF
          base64 -d /tmp/r5b_bundle.b64 > /tmp/r5b_bundle.tgz
          tar -xzf /tmp/r5b_bundle.tgz
          sha256sum /tmp/r5b_bundle.tgz > BUNDLE_SHA256.txt
      - name: Install frozen dependencies and run deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 4 -r src/requirements.txt
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee TESTS.log
          python -m pip freeze > DEPENDENCIES_USED.txt
      - name: Freeze full 5,795-file inventory and static 2023-2025 trading calendar
        id: plan
        shell: bash
        env:
          FIRST: ${{ inputs.first_year }}
          LAST: ${{ inputs.last_year }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python src/r5b_master.py plan --out plan --first "$FIRST" --last "$LAST" --shards "$SHARDS" --offline 2>&1 | tee PLAN.log
          python - <<'PY_OUT'
          import json, os
          p=json.load(open('plan/matrix.json'))
          c=json.load(open('plan/contract.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(p,separators=(',',':'))+'\n')
              f.write('contract='+c['contract_sha256']+'\n')
          print('inventory',c['inventory_files'],'calendar_source',c.get('calendar_source'),'years',c.get('calendar_years_available'))
          PY_OUT
      - name: Upload executable source and immutable plan
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-V11-CODE-${{ github.run_id }}
          path: |
            src/
            tests/
            plan/
            TESTS.log
            PLAN.log
            DEPENDENCIES_USED.txt
            BUNDLE_SHA256.txt
          retention-days: 2
          compression-level: 6
          if-no-files-found: error

  replay:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      RAW: ${{ inputs.retain_raw }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: R5B-MASTER-V11-CODE-${{ github.run_id }}
          path: bundle/
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 4 -r bundle/src/requirements.txt
      - name: Restore cross-run daily-reference and completed-security checkpoints
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: checkpoints/
          key: r5b-master-v11-${{ needs.prepare.outputs.contract }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r5b-master-v11-${{ needs.prepare.outputs.contract }}-${{ matrix.shard }}-
      - name: Run assigned securities with persistent BaoStock session and one automatic retry
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p result/symbols checkpoints
          EXTRA=()
          if [ "$RAW" = "true" ]; then EXTRA+=(--retain-raw); fi
          python bundle/src/r5b_master.py shard --plan bundle/plan --out result --cache checkpoints --shard "$SHARD" --budget-seconds 9000 "${EXTRA[@]}" 2>&1 | tee result/RUN_FIRST.log
          FIRST_RC=${PIPESTATUS[0]}
          FINAL_RC=$FIRST_RC
          if [ "$FIRST_RC" -ne 0 ]; then
            echo "First pass incomplete; preserving checkpoints and waiting 180 seconds before retry."
            sleep 180
            python bundle/src/r5b_master.py shard --plan bundle/plan --out result --cache checkpoints --shard "$SHARD" --budget-seconds 6000 "${EXTRA[@]}" 2>&1 | tee result/RUN_RETRY.log
            FINAL_RC=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$FINAL_RC" > result/PROCESS_EXIT_CODE.txt
          if [ ! -f result/SUMMARY.json ]; then
            echo "::error title=R5B shard hard failure::Shard $SHARD did not produce SUMMARY.json"
            exit 1
          fi
          if [ "$FINAL_RC" -ne 0 ]; then
            echo "::warning title=R5B shard research gaps::Shard $SHARD completed accounting but still has retryable data-reference gaps. Final collector will report them."
          fi
          exit 0
      - name: Save checkpoints even when references remain incomplete
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: checkpoints/
          key: r5b-master-v11-${{ needs.prepare.outputs.contract }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload this shard's accounting evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-V11-PART-${{ github.run_id }}-${{ matrix.shard }}
          path: result/
          overwrite: true
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  collect:
    needs: [prepare, replay]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: R5B-MASTER-V11-CODE-${{ github.run_id }}
          path: bundle/
      - name: Download all available shard results
        uses: actions/download-artifact@v4
        with:
          pattern: R5B-MASTER-V11-PART-${{ github.run_id }}-*
          path: parts/
          merge-multiple: false
      - name: Build a single FINAL package and keep incomplete-data status explicit
        shell: bash
        run: |
          set +e
          mkdir -p FINAL/SOURCE_USED
          python -m pip install --disable-pip-version-check numpy==1.26.4
          cp bundle/src/r5b_*.py bundle/src/requirements.txt bundle/src/market_seed.json.gz FINAL/SOURCE_USED/
          python bundle/src/r5b_master.py collect --plan bundle/plan --parts parts --out FINAL 2>&1 | tee FINAL/COLLECT.log
          RC=${PIPESTATUS[0]}
          printf '%s\n' "$RC" > FINAL/COLLECT_EXIT_CODE.txt
          if [ ! -f FINAL/SUMMARY.json ]; then
            echo "::error title=R5B collector hard failure::No SUMMARY.json was produced"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::warning title=R5B result incomplete::FINAL was produced, but some symbols remain data-incomplete. Read REPORT.md and retry_symbols.json; do not interpret missing references as zero signals."
          fi
          exit 0
      - name: Add run identity and immutable hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_MANIFEST'
          import hashlib,json,os
          from pathlib import Path
          p=Path('FINAL')
          info={'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'workflow_commit':os.environ['GITHUB_SHA'],'full_a_certified':False,'workflow_version':'R5B-MASTER-1.1-RC-20260919'}
          (p/'GITHUB_RUN.json').write_text(json.dumps(info,indent=2),encoding='utf-8')
          sizes={str(f.relative_to(p)):f.stat().st_size for f in p.rglob('*') if f.is_file() and f.name not in ['FILE_SIZES.json','MANIFEST_SHA256.json']}
          (p/'FILE_SIZES.json').write_text(json.dumps(sizes,indent=2),encoding='utf-8')
          hashes={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f.name!='MANIFEST_SHA256.json'}
          (p/'MANIFEST_SHA256.json').write_text(json.dumps(hashes,indent=2),encoding='utf-8')
          report=(p/'REPORT.md').read_text(encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(report+'\n\nOnly download the FINAL artifact. Intermediate PART artifacts will be deleted automatically after FINAL is uploaded.\n')
          PY_MANIFEST
      - name: Upload the only result you need to download
        uses: actions/upload-artifact@v4
        with:
          name: R5B-MASTER-V11-FINAL-${{ inputs.first_year }}-${{ inputs.last_year }}-${{ github.run_id }}
          path: FINAL/
          overwrite: true
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
      - name: Delete intermediate PART and CODE artifacts so the page does not show 100+ files
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select((.name|startswith("R5B-MASTER-V11-PART-")) or (.name|startswith("R5B-MASTER-V11-CODE-"))) | .id' | while read -r ID; do
            [ -n "$ID" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" || true
          done
          exit 0
