name: R5B Master All-Stock Backtest v1.1

on:
  workflow_dispatch:
    inputs:
      first_year:
        description: First signal year
        required: true
        default: '2023'
        type: choice
        options: ['2023','2024','2025']
      last_year:
        description: Last signal year
        required: true
        default: '2025'
        type: choice
        options: ['2023','2024','2025']
      shards:
        description: Full-inventory shards (default 128)
        required: true
        default: '128'
        type: choice
        options: ['32','64','128']
      retain_raw:
        description: Retain native minute CSV inside PART artifacts (normally false)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: r5b-master-v11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      contract: ${{ steps.plan.outputs.contract }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
