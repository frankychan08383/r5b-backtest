          (p/'RUN_SUMMARY.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'status':'PILOT_RESEARCH_NOT_FULL_A','board_results':summary,'full_a_certified':False,'new_raw_minutes_in_board_folders':True,'source_minute_label_semantics_not_certified':True},indent=2),encoding='utf-8')
          lines=['# R5B Phase3 2023 pilot replay','', '**This is NOT a full-A/three-year backtest or trade permission.**', '', 'Download the FINAL ZIP and upload it to ChatGPT. Raw minute CSV.GZ files are included.', '', '|Board|Status|Attempted|Replayed|Scenario positions|','|---|---|---:|---:|---:|']
          for r in summary:lines.append('|'+str(r['board'])+'|'+str(r['status'])+'|'+str(r.get('symbols_attempted','UNKNOWN'))+'|'+str(r.get('symbols_replayed','UNKNOWN'))+'|'+str(r.get('scenario_positions','UNKNOWN'))+'|')
          (p/'REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines))
          for f in sorted(p.rglob('*')):
              if f.is_file() and f!=p/'MANIFEST_SHA256.json':
                  h=hashlib.sha256()
                  with f.open('rb') as x:
                      for b in iter(lambda:x.read(1048576),b''):h.update(b)
                  manifest[str(f.relative_to(p))]=h.hexdigest()
          (p/'MANIFEST_SHA256.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          R5B_COLLECT_EOF
      - name: Upload FINAL result ZIP (choose this artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R5B-PHASE3-2023-REPLAY-FINAL-${{ github.run_id }}
          path: combined/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
