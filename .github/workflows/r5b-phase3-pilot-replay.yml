                      calrows=rs_rows(bs.query_trade_dates(start_date=str(WARMUP),end_date=str(BUFFER_END)))
                      calendar=[date.fromisoformat(r['calendar_date']) for r in calrows if r['is_trading_day']=='1']
                      write_rows(out/'trade_calendar.csv',calrows)
                  except Exception as e:
                      raw_errors.append({'stage':'baostock_login_calendar','error':repr(e)});bs=None
              try:
                for rec in cohort:
                  key=rec['exchange']+'_'+rec['symbol'];s={'symbol':key,'board':args.board,'status':'STARTED'}
                  try:
                      raw=download_and_export(rec,out);s['raw_export_rows']=len(raw)
                      if args.board=='BSE':
                          s['status']='RAW_EXPORTED_BSE_REFERENCE_AND_ID_MAP_MISSING';status.append(s);continue
