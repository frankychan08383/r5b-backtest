name: R5B 2023 Phase3 pilot replay and raw data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5b-phase3-pilot
  cancel-in-progress: false

jobs:
  replay:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        board: [SH_MAIN, SZ_MAIN, CHINEXT, STAR, BSE]
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_ETAG_TIMEOUT: '30'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
      PYTHONUNBUFFERED: '1'
      R5B_BOARD: ${{ matrix.board }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create evidence folder
        shell: bash
        run: mkdir -p "phase3/$R5B_BOARD"
      - name: Install public-data dependencies (no private tokens)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 pyarrow==17.0.0 huggingface_hub==0.34.4 'baostock>=0.8.9,<0.9'
          python -m pip freeze > "phase3/$R5B_BOARD/dependencies.txt"
      - name: Write fixed pilot engine and execution tests
        shell: bash
        run: |
          set -euo pipefail
          cat > phase3_replay.py <<'R5B_SOURCE_EOF'
          """R5B Phase3: fixed pilot, raw-data retention and conditional event replay.
          Research only. No orders, no portfolio returns, no parameter training.
          Bar START labels and intrabar OHLC crossing are explicitly UNVERIFIED hypotheses.
          """
          from __future__ import annotations
          import argparse,bisect,csv,gzip,hashlib,io,json,math,os,shutil,statistics,struct,sys,time,traceback
          from collections import Counter,defaultdict
          from datetime import date,datetime,timedelta
          from decimal import Decimal,ROUND_HALF_UP
          from fractions import Fraction
          from pathlib import Path
          from dataclasses import dataclass
          YEAR=2023
          REPO='neigezhu/china-a-share-1min-ohlcv'
          REVISION='ba589a11534825044fe5a6b84838f50ba8d8d188'
          START=date(2023,1,1);END=date(2023,12,31)
          WARMUP=date(2022,12,1);BUFFER_END=date(2024,1,31)
          VARIANTS=['BASE_RAW','D4_ONLY','G9_ONLY','FILTERED','BEST','ABL_TIME','ABL_DIST6','ABL_GAIN35','ABL_TIME_DIST6','ABL_TIME_GAIN35','ABL_DIST6_GAIN35']
          COSTS=[0,10,20,30,50]
          COHORT=[{'path': 'data/stock_1m/SH/600824.parquet', 'exchange': 'SH', 'symbol': '600824', 'board': 'SH_MAIN', 'sha256': 'f97d6713134605d013ba719e2d1d68130b9b5f6e572359e61973bae04c50d06d'}, {'path': 'data/stock_1m/SH/603915.parquet', 'exchange': 'SH', 'symbol': '603915', 'board': 'SH_MAIN', 'sha256': '0a7d8e5c0b4f609a40092b20f9af62384ea4bdc3908eeec5cec99cf3d94560a9'}, {'path': 'data/stock_1m/SH/603319.parquet', 'exchange': 'SH', 'symbol': '603319', 'board': 'SH_MAIN', 'sha256': '93840094e094f2a37a79bdeabb4752d3736eda72536767afd6e56cf9f4c6821a'}, {'path': 'data/stock_1m/SH/603416.parquet', 'exchange': 'SH', 'symbol': '603416', 'board': 'SH_MAIN', 'sha256': '58c8d6be36b388f8f60f1c3bab4240dcf9770980db69002772fcaf9152704a07'}, {'path': 'data/stock_1m/SH/603359.parquet', 'exchange': 'SH', 'symbol': '603359', 'board': 'SH_MAIN', 'sha256': 'af2864ae51f8d0468d15ec8a47e3e1eb6d43d1887d951e9dce3e51c0e3cdf18e'}, {'path': 'data/stock_1m/SH/603800.parquet', 'exchange': 'SH', 'symbol': '603800', 'board': 'SH_MAIN', 'sha256': 'c6af0de2a7597f5c585959553ce1b0efb25dcea3645e0cd1f37fab02ffcf1b4b'}, {'path': 'data/stock_1m/SH/601678.parquet', 'exchange': 'SH', 'symbol': '601678', 'board': 'SH_MAIN', 'sha256': '52a03fd2641ade5d31b03d62b851723111fa3439278d53f6c4d6c8b736565d58'}, {'path': 'data/stock_1m/SH/603026.parquet', 'exchange': 'SH', 'symbol': '603026', 'board': 'SH_MAIN', 'sha256': '1a9209e257e939e89587922061ee6813a95d4d3a563151fdbd6e990eb20b87a3'}, {'path': 'data/stock_1m/SZ/000877.parquet', 'exchange': 'SZ', 'symbol': '000877', 'board': 'SZ_MAIN', 'sha256': 'f7a2add6af7d329169bae43ee4004481b5c32acd81de53c508fcdf262d1b9117'}, {'path': 'data/stock_1m/SZ/001332.parquet', 'exchange': 'SZ', 'symbol': '001332', 'board': 'SZ_MAIN', 'sha256': 'f85b50ee497ae838e7bda69ded484759a8db525a3c6eb29ab3bb131f45cc4264'}, {'path': 'data/stock_1m/SZ/002236.parquet', 'exchange': 'SZ', 'symbol': '002236', 'board': 'SZ_MAIN', 'sha256': '52c31b1537a17aef7bed520afdcdbd412837a484efae42cedb42e26c0ff