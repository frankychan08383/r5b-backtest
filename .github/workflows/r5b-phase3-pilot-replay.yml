                      s.update(status='RESEARCH_REPLAY_COMPLETED',positions=len(tr)+len(tr2),target_data_quarantine_days=sum(a['status']=='DATA_QUARANTINE_NOT_NO_SIGNAL' and str(START)<=a['date']<=str(END) for a in au))
                  except Exception as e:
