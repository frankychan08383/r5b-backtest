name: R5B Master All-Stock Backtest v1.2
run-name: R5B v1.2 ${{ inputs.first_year }}-${{ inputs.last_year }} shared references then parallel replay

on:
  workflow_dispatch:
    inputs:
      first_year:
        description: First signal year (frozen rules, no threshold fitting)
        required: true
        default: '2023'
        type: choice
        options: ['2023', '2024', '2025']
      last_year:
        description: Last signal year
        required: true
        default: '2025'
        type: choice
        options: ['2023', '2024', '2025']
      shards:
        description: Full inventory shards; replay concurrency is 16
        required: true
        default: '128'
        type: choice
        options: ['32', '64', '128']
      resume_run_id:
        description: Optional older run in THIS repository; only verified public reference data are reused
        required: false
        default: '35417463058'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: r5b-master-v12-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_ETAG_TIMEOUT: '20'
  HF_HUB_DOWNLOAD_TIMEOUT: '60'
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'

jobs:
  prepare:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      contract: ${{ steps.plan.outputs.contract }}
      execution: ${{ steps.plan.outputs.execution }}
      refkey: ${{ steps.plan.outputs.refkey }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore and verify the complete embedded source bundle
        shell: bash
        run: |
          set -euo pipefail
