          expected='b221f09a0dc6541f764c6ad2ffd5106d1cdc0a0d0718dbe21a6649dbf4dcd8d2'
          assert hashlib.sha256(data).hexdigest()==expected, 'EMBEDDED_BUNDLE_HASH_MISMATCH'
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as t:
              for m in t.getmembers():
                  p=PurePosixPath(m.name)
                  if not m.isfile() or p.is_absolute() or '..' in p.parts or p.parts[0] not in ('src','tests'):
                      raise ValueError('UNSAFE_BUNDLE_MEMBER:'+m.name)
                  f=Path(m.name);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(t.extractfile(m).read())
          Path('BUNDLE_SHA256.txt').write_text(expected+'\n')
          PY_UNPACK
      - name: Install dependencies and run execution plus orchestration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 3 -r src/requirements.txt
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee TESTS.log
          python -m pip freeze > DEPENDENCIES_USED.txt
      - name: Freeze all 5795 source files and the research trading calendar
        id: plan
        shell: bash
        env:
          FIRST: ${{ inputs.first_year }}
          LAST: ${{ inputs.last_year }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python src/r5b_v12.py plan --out plan --first "$FIRST" --last "$LAST" --shards "$SHARDS"
          python - <<'PY_PLAN'
          import json,os
          from pathlib import Path
          c=json.loads(Path('plan/contract.json').read_text())
          m=json.loads(Path('plan/matrix.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(m,separators=(',',':'))+'\n')
              f.write('contract='+c['contract_sha256']+'\n')
              f.write('execution='+c['execution_fingerprint']+'\n')
              f.write('refkey='+c['reference_cache_key']+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# R5B v1.2\n\nFull inventory: '+str(c['inventory_files'])+' files.\n\nNext: shared daily reference acquisition with TWO supervised connections. Minute replay then uses up to SIXTEEN jobs and ZERO BaoStock connections.\n\nGreen execution is not certified data or profits.\n')
          PY_PLAN
      - name: Save immutable source and plan
        uses: actions/upload-artifact@v4.6.2
        with:
          name: R5B-MASTER-V12-CODE-${{ github.run_id }}
          path: |
            src/
            tests/
            plan/
            TESTS.log
            DEPENDENCIES_USED.txt
            BUNDLE_SHA256.txt
          overwrite: true
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
      - name: Preserve preparation failure as a FINAL report
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p EARLY_FINAL
          printf '%s\n' '# R5B v1.2 preparation failed' 'No backtest ran. Read the prepare job log. Do not interpret this as zero signals.' > EARLY_FINAL/REPORT.md
          printf '%s\n' '{"status":"PREPARE_FAILED_NOT_BACKTEST","trade_permission":false}' > EARLY_FINAL/SUMMARY.json
          cp TESTS.log DEPENDENCIES_USED.txt BUNDLE_SHA256.txt EARLY_FINAL/ 2>/dev/null || true
      - name: Upload early failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: R5B-MASTER-V12-FINAL-${{ inputs.first_year }}-${{ inputs.last_year }}-${{ github.run_id }}
          path: EARLY_FINAL/
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  reference_cache:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      replay_allowed: ${{ steps.gate.outputs.replay_allowed }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          name: R5B-MASTER-V12-CODE-${{ github.run_id }}
          path: bundle/
      - name: Install reference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 3 baostock==0.8.9
          mkdir -p reference_store
      - name: Restore shared reference checkpoints from compatible earlier v1.2 runs
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: reference_store/
          key: r5b-v12-refs-${{ needs.prepare.outputs.refkey }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r5b-v12-refs-${{ needs.prepare.outputs.refkey }}-
      - name: Recover available public daily inputs from the previous run (no old trade-result inheritance)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          python bundle/src/r5b_v12.py recover --plan bundle/plan --store reference_store --run-id "$RESUME_RUN_ID"
      - name: Build one shared daily-reference snapshot with hard request deadlines
        id: acquire
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python bundle/src/r5b_v12.py references --plan bundle/plan --store reference_store --budget 10800 2>&1 | tee REFERENCE_RUN.log
      - name: Publish the reference gate and preserve errors
        id: gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference_store
          if [ -f REFERENCE_RUN.log ]; then cp REFERENCE_RUN.log reference_store/REFERENCE_RUN.log; fi
          python - <<'PY_GATE'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'bundle/src')
          p=Path('reference_store/REFERENCE_SUMMARY.json')
          # Only use a summary written by THIS acquisition attempt; an exception cannot reuse a cached green summary.
          ok=os.environ.get('ACQUIRE_OUTCOME')=='success'
          if not p.exists() or not ok:
              p.write_text(json.dumps({'status':'REFERENCE_CODE_OR_ENVIRONMENT_ERROR','replay_allowed':False,'trade_permission':False}))
          s=json.loads(p.read_text());ready=bool(s.get('replay_allowed')) and ok
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('replay_allowed='+str(ready).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Shared reference gate\n\n**'+s.get('status','UNKNOWN')+'**\n\n```json\n'+json.dumps(s,indent=2)+'\n```\n\nIf blocked, all minute replay jobs are skipped to avoid repeating a multi-hour provider outage. FINAL still contains the cause.\n')
          try:
              import r5b_v12 as v
              v.freeze_store('reference_store',s)
          except Exception as e:
              Path('reference_store/FREEZE_ERROR.txt').write_text(repr(e))
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('replay_allowed=false\n')
          PY_GATE
        env:
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
      - name: Save all validated and partial daily inputs for another run
        if: ${{ always() }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: reference_store/
          key: r5b-v12-refs-${{ needs.prepare.outputs.refkey }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Share the frozen reference snapshot with every replay shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: R5B-MASTER-V12-REF-${{ github.run_id }}
          path: reference_store/
          overwrite: true
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
      - name: Stop early on a blocked reference source (not a strategy loss)
        if: ${{ steps.gate.outputs.replay_allowed != 'true' }}
        shell: bash
        run: |
          echo '::error title=Shared reference source blocked::Read the reference summary and FINAL artifact. No all-market minute replay was launched.'
          exit 1

  replay:
    needs: [prepare, reference_cache]
    if: ${{ needs.reference_cache.outputs.replay_allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          name: R5B-MASTER-V12-CODE-${{ github.run_id }}
          path: bundle/
      - uses: actions/download-artifact@v5
        with:
          name: R5B-MASTER-V12-REF-${{ github.run_id }}
          path: reference_store/
      - name: Install minute replay dependencies (no BaoStock adapter is called here)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 3 numpy==1.26.4 pyarrow==17.0.0 huggingface_hub==0.34.4
          mkdir -p checkpoints result/symbols
      - name: Restore per-security replay checkpoints
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: checkpoints/
          key: r5b-v12-replay-${{ needs.prepare.outputs.execution }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r5b-v12-replay-${{ needs.prepare.outputs.execution }}-${{ matrix.shard }}-
      - name: Replay all assigned files from read-only references; retry only failed minute requests once
        id: replay_step
        continue-on-error: true
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python bundle/src/r5b_v12.py replay --plan bundle/plan --refs reference_store --out result --cache checkpoints --shard "$SHARD" --budget-seconds 9000 2>&1 | tee result/RUN.log
      - name: Save completed checkpoints even if the shard is interrupted
        if: ${{ always() }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: checkpoints/
          key: r5b-v12-replay-${{ needs.prepare.outputs.execution }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve shard completion status
        if: ${{ always() }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          REPLAY_OUTCOME: ${{ steps.replay_step.outcome }}
        run: |
          mkdir -p result
          python - <<'PY_PART'
          import json,os
          from pathlib import Path
          p=Path('result/PROCESS.json')
          p.write_text(json.dumps({'shard':os.environ['SHARD'],'outcome':os.environ['REPLAY_OUTCOME'],'trade_permission':False}))
          PY_PART
      - name: Upload recoverable shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: R5B-MASTER-V12-PART-${{ github.run_id }}-${{ matrix.shard }}
          path: result/
          overwrite: true
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
      - name: Distinguish a real replay from a failed or incomplete process
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY_SHARD_STATE'
          import json,sys
          from pathlib import Path
          p=Path('result/SUMMARY.json')
          if not p.exists():
              print('::error::Shard did not complete accounting; its partial evidence has been retained.');sys.exit(1)
          s=json.loads(p.read_text())
          if s.get('network_retryable_symbols'):
              print('::error::Minute download/timeout gaps remain. Use FINAL and compatible checkpoints; missing data is not zero signals.');sys.exit(1)
          if s.get('data_gap_symbols'):
              print('::warning::Conditional data gaps remain. Read FINAL coverage; no profitability certification.')
          PY_SHARD_STATE

  collect:
    needs: [prepare, reference_cache, replay]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          name: R5B-MASTER-V12-CODE-${{ github.run_id }}
          path: bundle/
      - name: Download available shared reference evidence
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: R5B-MASTER-V12-REF-${{ github.run_id }}
          path: reference_store/
      - name: Download all available replay partitions; reference-gate failure may mean none
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: R5B-MASTER-V12-PART-${{ github.run_id }}-*
          path: parts/
          merge-multiple: false
      - name: Build one FINAL with successes, missing-file ledger and preserved references
        id: make_final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p FINAL parts reference_store
          python -m pip install --disable-pip-version-check --retries 3 numpy==1.26.4
          python bundle/src/r5b_v12.py collect --plan bundle/plan --refs reference_store --parts parts --out FINAL 2>&1 | tee FINAL/COLLECT.log
          cp -r bundle/tests FINAL/TESTS_USED
          cp bundle/TESTS.log bundle/DEPENDENCIES_USED.txt bundle/BUNDLE_SHA256.txt FINAL/
          python bundle/src/r5b_v12.py seal --out FINAL
          cat FINAL/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve collector failure details rather than hide the failed run
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p FINAL
          printf '%s\n' '# R5B v1.2 collection step failed' 'No certified summary. Intermediate artifacts have NOT been deleted. Read workflow logs.' > FINAL/COLLECT_FAILURE.md
          if [ ! -f FINAL/SUMMARY.json ]; then printf '%s\n' '{"status":"COLLECT_STEP_FAILED","trade_permission":false}' > FINAL/SUMMARY.json; fi
      - name: Upload the single FINAL file to download
        id: upload_final
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: R5B-MASTER-V12-FINAL-${{ inputs.first_year }}-${{ inputs.last_year }}-${{ github.run_id }}
          path: FINAL/
          overwrite: true
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
      - name: Remove only THIS run's temporary artifacts after verified complete FINAL upload
        if: ${{ steps.upload_final.outcome == 'success' && steps.make_final.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_NAME: R5B-MASTER-V12-FINAL-${{ inputs.first_year }}-${{ inputs.last_year }}-${{ github.run_id }}
          FINAL_DIGEST: ${{ steps.upload_final.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY_CLEAN'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'bundle/src')
          import r5b_v12 as v
          s=json.loads(Path('FINAL/SUMMARY.json').read_text())
          if not s.get('all_inventory_processing_complete'):
              print('Incomplete run: retain CODE/REF/PART for recovery. User downloads FINAL only.');sys.exit(0)
          v.seal('FINAL')
          repo=os.environ['GITHUB_REPOSITORY'];rid=os.environ['GITHUB_RUN_ID']
          cp=subprocess.run(['gh','api',f'repos/{repo}/actions/runs/{rid}/artifacts?per_page=100','--paginate','--slurp'],capture_output=True,text=True,check=True,timeout=90)
          artifacts=[a for page in json.loads(cp.stdout) for a in page.get('artifacts',[])]
          ids=v.cleanup_ids(artifacts,rid,os.environ['GITHUB_RUN_ATTEMPT'],os.environ['FINAL_NAME'],os.environ['FINAL_DIGEST'])
          for aid in ids:
              subprocess.run(['gh','api','-X','DELETE',f'repos/{repo}/actions/artifacts/{int(aid)}'],check=True,timeout=30)
          print('Deleted only verified current-run intermediate artifacts:',len(ids))
          PY_CLEAN
