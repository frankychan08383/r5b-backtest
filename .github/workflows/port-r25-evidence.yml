name: PORT R25 无损证据回传
run-name: PORT-R25 source ${{ inputs.source_run_id }}
"on":
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "已有R24运行编号（不是COMPACT运行编号）"
        required: true
        default: "35368288514"
        type: string
      source_artifact:
        description: "已有R24 FINAL名称"
        required: true
        default: "PORT-R24-FINAL-35368288514-1"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: port-r25-${{ github.repository }}-${{ inputs.source_run_id }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: 准备并验证内置程序
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r25_exports
          python3 - <<'PYCODE'
          import os,re,base64,gzip,hashlib
          from pathlib import Path
          assert re.fullmatch(r"[0-9]+",os.environ["SOURCE_RUN_ID"]), "INVALID_RUN_ID"
          assert re.fullmatch(r"PORT-R24-FINAL-[0-9]+-[0-9]+",os.environ["SOURCE_ARTIFACT"]), "INVALID_ARTIFACT_NAME"
          code=gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(code).hexdigest()=="89f17028fab421eddd0254a2058be3cd883e33dadcf48e98b58cd6354a14b187"
          compile(code,"export_evidence.py","exec")
          Path("export_evidence.py").write_bytes(code)
          PYCODE
          python3 export_evidence.py --selftest
      - name: 仅下载已有FINAL，不重跑市场采集
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_artifact
          gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir source_artifact
      - name: 全文无损导出及原PDF哈希复核
        id: pack
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 export_evidence.py --source source_artifact --out r25_exports 2>&1 | tee r25_exports/EXPORT_RUN.log
      - name: 展示结果，先上传INDEX再上传小包
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          p=Path("r25_exports/SUMMARY.json")
          lines=["# PORT-R25 无损证据回传","只整理已有R24，不重新采集、不训练、不下单。"]
          if p.exists():
              d=json.loads(p.read_text())
              for k in ["full_text_json_files","full_text_pages","PDF_original_files_hash_checked","small_original_PDFs_included","export_failures"]:
                  lines.append(f"- {k}: {d[k]}")
              lines.append("先传 PORT-R25-INDEX-01.zip；再传EVIDENCE与PDF-REVIEW。每个ZIP独立完整，设计上限48 MiB。")
          else: lines.append("没有生成SUMMARY：查看下载/程序日志。不是0条合格数据。")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          PYCODE
      - name: 上传可单独发送的小包与诊断
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PORT-R25-RETURN-${{ inputs.source_run_id }}-${{ github.run_attempt }}
          path: r25_exports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: 保留真实导出失败状态
        if: steps.pack.outcome == 'failure'
        shell: bash
        run: |
          echo "导出有缺口。已有小包和日志已先上传，请查看INDEX/export_failures.json，不需要重跑R24。"
          exit 2
