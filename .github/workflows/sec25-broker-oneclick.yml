            sec25-618e1e6991cd82da-s${{ matrix.shard }}-
      - name: Create failure-safe checkpoint folder
        shell: bash
        run: |
          mkdir -p "work/shard-$SEC25_SHARD"
          cp program/618e1e6991cd82daaa716d87192227e850de3d92e39682eac008e3a7659ce42c256.txt "work/shard-$SEC25_SHARD/"
      - name: Install pinned data and PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check baostock==0.9.3 pypdf==6.15.0
          python -m pip freeze > "work/shard-$SEC25_SHARD/dependencies.txt"
      - name: Acquire all assigned evidence with bounded retries and checkpoints
        timeout-minutes: 190
        shell: bash
        run: |
          set -euo pipefail
          python program/src/collector.py collect --shard "$SEC25_SHARD" --nshards 8 --root "work/shard-$SEC25_SHARD" --asof 2026-09-18 --seconds 10800 2>&1 | tee "work/shard-$SEC25_SHARD/execution.log"
      - name: Record exit status and hash surviving files
        if: ${{ always() }}
        env:
          ACQUIRE_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "work/shard-$SEC25_SHARD"
          python - <<'SEC25_STATUS_EOF'
          import os,json
          from pathlib import Path
          p=Path('work')/('shard-'+os.environ['SEC25_SHARD'])
          (p/'GITHUB_JOB_STATE.json').write_text(json.dumps({'status':os.environ['ACQUIRE_STATUS'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'not_investment_validation':True},indent=2))
          SEC25_STATUS_EOF
          python program/src/collector.py manifest --root "work/shard-$SEC25_SHARD"
      - name: Persist checkpoint for same-entrypoint reruns
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: work
          key: sec25-618e1e6991cd82da-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save shard for automatic final merge
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SEC25-PART-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/shard-${{ matrix.shard }}/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  final:
    needs: [prepare, acquire]
    if: ${{ always() && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore the public program
        uses: actions/download-artifact@v8
        with:
          name: SEC25-PROGRAM-${{ github.run_id }}-${{ github.run_attempt }}
          path: program
      - name: Download all available shard archives, including failed jobs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: SEC25-PART-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: final/shards
          merge-multiple: false
      - name: Build complete-scope coverage table and honest completion summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          cp -R program final/public_program
          python program/src/collector.py merge --root final/shards --out final
          python program/src/collector.py manifest --root final
      - name: Download only this FINAL artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SEC25-BROKER-FINAL-${{ github.run_id }}-${{ github.run_attempt }}
          path: final/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
