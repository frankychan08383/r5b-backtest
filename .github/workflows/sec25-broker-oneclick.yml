name: SEC25 Broker public evidence one-click

on:
  workflow_dispatch:

# Public sources only. Do NOT upload account/holdings files or private model ZIPs.
# Private repositories are intentionally skipped to avoid an unreviewed compute bill.
permissions:
  contents: read
  actions: read

concurrency:
  group: sec25-broker-public-evidence
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Write self-contained public program and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p program
          cat > program_payload.json <<'SEC25_PAYLOAD_EOF'
          {"src/collector.py":"#!/usr/bin/env python3\n\"\"\"SEC25 public-evidence acquisition. No orders, no strategy retuning, no PIT certification.\nThe same entrypoint performs collection, retries, checkpoints, validation and final merge.\nSuccessful downloads are evidence candidates, not investment-model validation.\n\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, gzip, hashlib, html, io, json, math, os, re, signal, socket\nimport statistics, subprocess, sys, time, urllib.error, urllib.parse, urllib.request\nfrom datetime import date, datetime, timedelta, timezone\nfrom pathlib import Path\nfrom collections import Counter\n\nHERE = Path(__file__).resolve().parent\nINPUT = HERE.parent / 'inputs'\nTZ = timezone(timedelta(hours=8))\nSAFE_HOSTS = {'www.cninfo.com.cn','static.cninfo.com.cn','disc.static.szse.cn',\n 'www.sse.com.cn','static.sse.com.cn','www.hkexnews.hk','xxzx.gyzq.com.cn',\n 'web.ifzq.gtimg.cn','proxy.finance.qq.com','datacenter-web.eastmoney.com','api.hkma.gov.hk'}\nCATEGORIES = ['category_ndbg_szsh','category_bndbg_szsh','category_yjdbg_szsh','category_sjdbg_szsh',\n 'category_qyfpxzcs_szsh','category_pg_szsh','category_zf_szsh','category_bcgz_szsh','category_tbclts_szsh']\nKEYWORDS = ['吸收合并','换股','上市公告书','停牌','复牌','更名','风险控制指标']\nKEY_LINES = ('营业总收入','营业收入','归属于','每股收益','净资产收益率','净资本','风险覆盖率',\n '流动性覆盖率','稳定资金率','资本杠杆率','核心净资本','其他权益工具','永续','客户资金','代理买卖证券款',\n '手续费及佣金','公允价值变动','投资收益','分部','未分配利润','每10股','每十股','派发','重述','重列')\n\nclass DataError(Exception): pass\nclass Deadline(Exception): pass\n\ndef dump(path, obj):\n    path=Path(path);path.parent.mkdir(parents=True,exist_ok=True)\n    tmp=path.with_suffix(path.suffix+'.tmp')\n    tmp.write_text(json.dumps(obj,ensure_ascii=False,indent=2,allow_nan=False,default=str),encoding='utf-8')\n    tmp.replace(path)\n\ndef rows_write(path, rows, fields=None):\n    path=Path(path);path.parent.mkdir(parents=True,exist_ok=True);rows=list(rows)\n    fields=fields or list(dict.fromkeys(k for r in rows for k in r)) or ['status']\n    with path.open('w',encoding='utf-8-sig',newline='') as f:\n        w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(rows)\n\ndef rows_read(path):\n    with Path(path).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))\n\ndef sha(x):return hashlib.sha256(x).hexdigest()\ndef file_sha(path):\n    h=hashlib.sha256()\n    with Path(path).open('rb') as f:\n        for block in iter(lambda:f.read(1048576),b''):h.update(block)\n    return h.hexdigest()\n\ndef require_url(url):\n    p=urllib.parse.urlparse(url)\n    if p.scheme!='https' or p.hostname not in SAFE_HOSTS or p.username or p.password:\n        raise DataError('UNAPPROVED_SOURCE_URL: '+url)\n    return url\n\nclass SafeRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        require_url(newurl)\n        return super().redirect_request(req,fp,code,msg,headers,newurl)\n\nclass Fetcher:\n    def __init__(self, root, seconds=10800, attempts=3, delay=1.2):\n        self.root=Path(root);self.root.mkdir(parents=True,exist_ok=True)\n        self.deadline=time.monotonic()+seconds;self.attempts=attempts;self.delay=delay\n        self.opener=urllib.request.build_opener(SafeRedirect())\n        self.records=[];self.errors=[]\n    def check(self):\n        if time.monotonic()>=self.deadline:raise Deadline('SOFT_DEADLINE_CHECKPOINTED')\n    def log(self, value):\n        self.records.append(value)\n        with (self.root/'http_log.jsonl').open('a',encoding='utf-8') as f:\n            f.write(json.dumps(value,ensure_ascii=False)+'\\n')\n    def get(self,url,payload=None,kind='json'):\n        self.check();require_url(url)\n        data=urllib.parse.urlencode(payload).encode() if payload is not None else None\n        key=sha(url.encode()+b'\\n'+(data or b''));folder=self.root/'objects'/key[:2]\n        path=folder/(key+('.pdf' if kind=='pdf' else '.json'));meta=folder/(key+'.meta.json')\n        if path.exists() and meta.exists():\n            try:\n                m=json.loads(meta.read_text())\n                age=(datetime.now(timezone.utc)-datetime.fromisoformat(m.get('retrieved_at_utc','2000-01-01T00:00:00+00:00'))).total_seconds()\n                if m.get('sha256')==file_sha(path) and m.get('url')==url and m.get('payload')==payload and (kind=='pdf' or age<86400):\n                    raw=path.read_bytes();self.validate(raw,kind)\n                    self.log({'url':url,'status':'REUSED_HASH_VERIFIED','sha256':m['sha256']})\n                    return raw,m,path\n            except (ValueError,TypeError,DataError,OSError):\n                self.log({'url':url,'status':'INVALID_CACHE_REFETCH'})\n        error=None\n        for attempt in range(self.attempts):\n            self.check();time.sleep(self.delay)\n            try:\n                req=urllib.request.Request(url,data=data,headers={'User-Agent':'Mozilla/5.0 (Research evidence archive)',\n                    'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Referer':'https://www.cninfo.com.cn/'})\n                with self.opener.open(req,timeout=min(45,max(1,self.deadline-time.monotonic()))) as resp:\n                    require_url(resp.geturl());raw=resp.read(64*1024*1024+1)\n                    if len(raw)>64*1024*1024:raise DataError('RESPONSE_SIZE_LIMIT_64MiB')\n                    if not 200<=resp.status<300:raise DataError('HTTP_STATUS_'+str(resp.status))\n                    ct=resp.headers.get('Content-Type','');self.validate(raw,kind)\n                    m={'url':url,'final_url':resp.geturl(),'payload':payload,'sha256':sha(raw),'bytes':len(raw),\n                       'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),'content_type':ct,\n                       'evidence':'ORIGINAL_DOWNLOAD_CANDIDATE_NOT_PIT_CERTIFIED'}\n                folder.mkdir(parents=True,exist_ok=True)\n                tmp=path.with_suffix(path.suffix+'.tmp');tmp.write_bytes(raw);tmp.replace(path);dump(meta,m)\n                self.log({'url':url,'attempt':attempt+1,'status':'DOWNLOADED','sha256':m['sha256'],'bytes':len(raw)})\n                return raw,m,path\n            except (urllib.error.URLError,TimeoutError,OSError,DataError,json.JSONDecodeError) as e:\n                error=f'{type(e).__name__}: {e}'\n                self.log({'url':url,'attempt':attempt+1,'status':'ERROR','error':error})\n                if isinstance(e,urllib.error.HTTPError) and e.code in (401,403,404):break\n                if attempt+1<self.attempts:time.sleep(min(2**(attempt+1),8))\n        raise DataError(error or 'FETCH_FAILED')\n    @staticmethod\n    def validate(raw,kind):\n        if not raw:raise DataError('EMPTY_RESPONSE')\n        if kind=='pdf':\n            if not raw.lstrip().startswith(b'%PDF-'):raise DataError('NOT_PDF_BYTES')\n            if b'%%EOF' not in raw[-4096:]:raise DataError('PDF_NO_EOF_POSSIBLY_TRUNCATED')\n        else:\n            x=json.loads(raw)\n            if not isinstance(x,(dict,list)):raise DataError('NON_CONTAINER_JSON')\n\n\ndef normalized_title(text):return html.unescape(re.sub('<[^>]+>','',str(text))).strip()\ndef doc_class(title):\n    t=normalized_title(title);compact=re.sub(r'\\s+','',t)\n    if any(x in compact for x in ['摘要','社会责任','可持续','ESG','受托管理','信用评级','债券年度报告']):return 'OTHER'\n    if re.search(r'(?:20\\d{2})年?(?:年度报告|年报|半年度报告|半年报|第一季度报告|第三季度报告)',compact):\n        if any(x in compact for x in ['审核意见','独立董事','核查意见','关于','议案','审计报告']):return 'REPORT_RELATED'\n        return 'PERIODIC_REPORT'\n    if any(x in compact for x in ['权益分派','利润分配实施','配股','换股','吸收合并','股票上市','停牌','复牌','退市','更名','风险控制指标']):return 'EVENT_CANDIDATE'\n    return 'OTHER'\n\ndef publish_meta(value):\n    try:\n        dt=datetime.fromtimestamp(float(value)/1000,TZ)\n        precision='DATE_ONLY_OR_MIDNIGHT_UNVERIFIED' if dt.hour==0 and dt.minute==0 and dt.second==0 else 'PROVIDER_TIMESTAMP_UNVERIFIED'\n        return dt.isoformat(),precision\n    except (ValueError,TypeError,OverflowError):return None,'UNKNOWN'\n\ndef paginate_json(fetch_page,max_pages=100):\n    all_rows=[];seen_pages=set();declared=None\n    for page in range(1,max_pages+1):\n        x=fetch_page(page)\n        if not isinstance(x,dict) or 'announcements' not in x or 'totalAnnouncement' not in x:raise DataError('CNINFO_SCHEMA_CHANGED')\n        total=int(x['totalAnnouncement']);a=x['announcements'] or []\n        if not isinstance(a,list):raise DataError('ANNOUNCEMENTS_NOT_LIST')\n        declared=total if declared is None else declared\n        if declared!=total:raise DataError('PAGINATION_TOTAL_CHANGED_RETRY_NEXT_RUN')\n        fingerprint=sha(json.dumps(a,sort_keys=True,ensure_ascii=False).encode())\n        if a and fingerprint in seen_pages:raise DataError('REPEATED_PAGE')\n        seen_pages.add(fingerprint);all_rows.extend(a)\n        if len(all_rows)>=total:return all_rows\n        if not a:raise DataError('EARLY_EMPTY_PAGE')\n    raise DataError('PAGINATION_CAP_INCOMPLETE')\n\ndef cninfo_list(fetcher,security,asof):\n    code=security['symbol'].split('.')[0];hk=security['symbol'].endswith('.HK')\n    map_url='https://www.cninfo.com.cn/new/data/'+('hke_stock.json' if hk else 'szse_stock.json')\n    org=None;map_error=None\n    try:\n        raw,_,_=fetcher.get(map_url);obj=json.loads(raw)\n        for a in obj.get('stockList',[]):\n            if str(a.get('code','')).lstrip('0')==code.lstrip('0'):\n                org=a.get('orgId');break\n    except DataError as e:map_error=str(e)\n    # Never substitute another issuer by fuzzy name. Code-only fallback is quarantined and must match secCode.\n    stock=code+','+str(org) if org else code\n    column='hke' if hk else 'szse';items={};errors=[]\n    queries=[('category',c) for c in CATEGORIES]+[('keyword',k) for k in KEYWORDS]\n    if hk:queries=[('keyword',k) for k in ['年報','中期報告','annual report','interim report','配股','股息','合併','股份上市']]\n    for typ,val in queries:\n        fetcher.check()\n        start='2025-01-01' if val in ('category_bndbg_szsh','category_yjdbg_szsh','category_sjdbg_szsh') else '2010-01-01'\n        base={'pageSize':'30','column':column,'tabName':'fulltext','plate':'','stock':stock,'secid':'','trade':'',\n              'category':val if typ=='category' else '', 'searchkey':val if typ=='keyword' else '',\n              'seDate':start+'~'+asof,'sortName':'time','sortType':'desc','isHLtitle':'true'}\n        try:\n            def fetch_page(page):\n                raw,_,_=fetcher.get('https://www.cninfo.com.cn/new/hisAnnouncement/query',{**base,'pageNum':str(page)})\n                return json.loads(raw)\n            for a in paginate_json(fetch_page):\n                codes=re.findall(r'\\d+',str(a.get('secCode','')))\n                if code.lstrip('0') not in [c.lstrip('0') for c in codes]:\n                    errors.append({'query':val,'error':'ISSUER_MISMATCH_REJECTED','returned_secCode':a.get('secCode')});continue\n                annid=str(a.get('announcementId',''))\n                if not annid:raise DataError('MISSING_ANNOUNCEMENT_ID')\n                stamp,precision=publish_meta(a.get('announcementTime'))\n                if stamp is None or stamp[:10]>asof:continue\n                title=normalized_title(a.get('announcementTitle',''))\n                url=urllib.parse.urljoin('https://static.cninfo.com.cn/',str(a.get('adjunctUrl','')))\n                x={'symbol':security['symbol'],'announcement_id':annid,'title':title,'published_at':stamp,\n                   'timestamp_precision':precision,'org_id':a.get('orgId',org),'category':doc_class(title),\n                   'url':url,'org_mapping':'FOUND' if org else 'CODE_ONLY_UNVERIFIED','strict_pit_certified':False}\n                if hk and re.search(r'(?i)(annual\\s*report|interim\\s*report|年報|中期報告)',title):x['category']='PERIODIC_REPORT'\n                items[annid]=x\n        except DataError as e:errors.append({'query':val,'error':str(e)})\n    return list(items.values()),errors,map_error\n\n\ndef extract_pdf(path):\n    \"\"\"Archive all extracted pages and a keyword index; no guessed table columns or OCR.\"\"\"\n    from pypdf import PdfReader\n    reader=PdfReader(str(path),strict=False)\n    if reader.is_encrypted:raise DataError('ENCRYPTED_PDF_MANUAL_REVIEW')\n    if not len(reader.pages):raise DataError('ZERO_PAGE_PDF')\n    pages=[];hits=[]\n    for num,page in enumerate(reader.pages,1):\n        text=page.extract_text() or '';pages.append({'page':num,'text':text})\n        for line in text.splitlines():\n            if any(k in line for k in KEY_LINES):hits.append({'page':num,'line':line[:1500]})\n    target=Path(str(path)+'.pages.json.gz')\n    with gzip.open(target,'wt',encoding='utf-8') as f:json.dump(pages,f,ensure_ascii=False)\n    return len(pages),hits,'TEXT_EXTRACTED_UNREVIEWED' if sum(len(x['text']) for x in pages)>100 else 'SCAN_OR_TEXT_MISSING_MANUAL_REVIEW'\n\n\ndef bars_validate(rows):\n    issues=[];seen=set()\n    for i,r in enumerate(rows):\n        dt=r.get('date','')\n        if not re.match(r'^\\d{4}-\\d{2}-\\d{2}$',dt):issues.append({'row':i,'issue':'BAD_DATE'});continue\n        if dt in seen:issues.append({'date':dt,'issue':'DUPLICATE_DATE'})\n        seen.add(dt)\n        try:\n            vals=[float(r[k]) for k in ('open','high','low','close')]\n            if not all(math.isfinite(v) for v in vals):raise ValueError('nonfinite')\n            o,h,l,c=vals\n            if h<max(o,c,l) or l>min(o,c,h):issues.append({'date':dt,'issue':'OHLC_ORDER'})\n            if min(vals)<=0 and r.get('tradestatus')!='0':issues.append({'date':dt,'issue':'NONPOSITIVE_ACTIVE_BAR'})\n        except (KeyError,ValueError,TypeError):issues.append({'date':dt,'issue':'INVALID_OHLC'})\n    return issues\n\n\ndef baostock_worker(symbol,root,asof):\n    import baostock as bs\n    root=Path(root);root.mkdir(parents=True,exist_ok=True);socket.setdefaulttimeout(35)\n    def alarm(*_):raise TimeoutError('BAOSTOCK_QUERY_60_SECOND_LIMIT')\n    signal.signal(signal.SIGALRM,alarm)\n    def call(label,fn,kwargs):\n        path=root/(label+'.csv');meta=root/(label+'.meta.json')\n        if path.exists() and meta.exists():\n            m=json.loads(meta.read_text())\n            if m.get('sha256')==file_sha(path) and m.get('asof')==asof and m.get('rows',0)>0:return\n        for attempt in range(3):\n            try:\n                signal.alarm(60);rs=fn(**kwargs)\n                if rs.error_code!='0':raise DataError(str(rs.error_code)+':'+rs.error_msg)\n                rows=[]\n                while rs.next():rows.append(dict(zip(rs.fields,rs.get_row_data())))\n                if rs.error_code!='0':raise DataError('ITERATION_'+rs.error_code)\n                signal.alarm(0)\n                rows_write(path,rows,rs.fields)\n                dump(meta,{'asof':asof,'symbol':symbol,'provider':'BAOSTOCK','kwargs':kwargs,\n                    'rows':len(rows),'sha256':file_sha(path),'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),\n                    'status':'PROVIDER_DATA_UNCERTIFIED' if rows else 'EMPTY_NOT_PROOF_OF_NO_EVENT',\n                    'strict_pit_certified':False,'total_return_certified':False})\n                return\n            except Exception as e:\n                signal.alarm(0)\n                dump(root/(label+'.error.json'),{'attempt':attempt+1,'error':str(e)})\n                if attempt<2:time.sleep(2**attempt)\n    try:\n        signal.alarm(45);lg=bs.login();signal.alarm(0)\n        if lg.error_code!='0':raise DataError('LOGIN_'+lg.error_msg)\n        code=symbol.split('.')[1].lower()+'.'+symbol.split('.')[0]\n        basic='date,code,open,high,low,close,volume,amount,adjustflag'\n        if code not in ('sh.000300','sh.510300','sh.512000'):\n            basic+=',preclose,tradestatus,isST,peTTM,pbMRQ'\n        call('daily_raw',bs.query_history_k_data_plus,dict(code=code,fields=basic,start_date='2010-01-01',end_date=asof,frequency='d',adjustflag='3'))\n        call('daily_qfq_proxy',bs.query_history_k_data_plus,dict(code=code,fields=basic,start_date='2010-01-01',end_date=asof,frequency='d',adjustflag='2'))\n        call('security_identity',bs.query_stock_basic,{'code':code})\n        call('trading_calendar',bs.query_trade_dates,{'start_date':'2010-01-01','end_date':asof})\n        # Recent five fiscal years first, then older annual observations. These are vendor vintages, NOT True PIT.\n        if code not in ('sh.000300','sh.510300','sh.512000'):\n            for year in list(range(2025,2020,-1))+list(range(2020,2014,-1)):\n                for kind,func in [('profit',bs.query_profit_data),('balance',bs.query_balance_data),('cashflow',bs.query_cash_flow_data)]:\n                    call(f'{kind}_{year}_Q4',func,dict(code=code,year=year,quarter=4))\n            for q in (1,2):\n                if f'2026-{q*3:02d}-01'<=asof:\n                    for kind,func in [('profit',bs.query_profit_data),('balance',bs.query_balance_data),('cashflow',bs.query_cash_flow_data)]:\n                        call(f'{kind}_2026_Q{q}',func,dict(code=code,year=2026,quarter=q))\n            for year in range(2026,2009,-1):\n                call(f'dividend_{year}',bs.query_dividend_data,dict(code=code,year=year,yearType='report'))\n            if hasattr(bs,'query_adjust_factor'):\n                call('adjustment_factors_proxy',bs.query_adjust_factor,dict(code=code,start_date='2010-01-01',end_date=asof))\n    except Exception as e:dump(root/'WORKER_ERROR.json',{'error':str(e),'symbol':symbol})\n    finally:\n        signal.alarm(0)\n        try:bs.logout()\n        except Exception:pass\n\n\ndef tencent_candidate(fetcher,security,asof):\n    sym=security['symbol'];code,mkt=sym.split('.');qt=mkt.lower()+code.zfill(5 if mkt=='HK' else 6)\n    result=[];errors=[]\n    for year in range(2026,2009,-1):\n        if str(year)>asof[:4]:continue\n        start=f'{year}-01-01';end=min(f'{year}-12-31',asof)\n        for adjust in ('','qfq'):\n            try:\n                endpoint='hkfqkline' if mkt=='HK' else 'fqkline'\n                url='https://web.ifzq.gtimg.cn/appstock/app/'+endpoint+'/get?'+urllib.parse.urlencode({'param':f'{qt},day,{start},{end},640,{adjust}'})\n                raw,meta,_=fetcher.get(url);x=json.loads(raw);block=x.get('data',{}).get(qt,{})\n                key='qfqday' if adjust else 'day';bars=block.get(key)\n                # Do not silently substitute unadjusted for adjusted bars or vice versa.\n                if not isinstance(bars,list):raise DataError('MISSING_'+key)\n                for b in bars:\n                    if len(b)<6:raise DataError('BAD_TENCENT_ROW')\n                    if not start<=str(b[0])<=end:continue\n                    result.append({'symbol':sym,'date':b[0],'open':b[1],'close':b[2],'high':b[3],'low':b[4],\n                       'volume_vendor_units':b[5],'adjustment':'QFQ_PROXY_NOT_TR' if adjust else 'RAW',\n                       'source_sha256':meta['sha256'],'provider':'TENCENT','source_url':url})\n            except DataError as e:errors.append({'year':year,'adjust':adjust,'error':str(e)})\n    return result,errors\n\n\ndef macro_candidates(fetcher,asof):\n    \"\"\"Research candidates only. No fake zero Rf; unavailable/mismatched schemas are explicit.\"\"\"\n    results={}\n    # Eastmoney's Treasury-yield panel: retains raw response, never labels it primary ChinaBond certification.\n    try:\n        all_rows=[]\n        for page in range(1,101):\n            url='https://datacenter-web.eastmoney.com/api/data/v1/get?'+urllib.parse.urlencode({\n                'reportName':'RPTA_WEB_TREASURYYIELD','columns':'ALL','sortColumns':'SOLAR_DATE','sortTypes':'-1',\n                'pageSize':'500','pageNumber':str(page),'source':'WEB','client':'WEB'})\n            raw,_,_=fetcher.get(url);x=json.loads(raw);r=x.get('result')\n            if not isinstance(r,dict) or not isinstance(r.get('data'),list):raise DataError('YIELD_SCHEMA_UNVERIFIED')\n            all_rows.extend(r['data'])\n            if page>=int(r.get('pages',1)):break\n        all_rows=[r for r in all_rows if '2010-01-01'<=str(r.get('SOLAR_DATE',''))[:10]<=asof]\n        rows_write(fetcher.root/'macro_cny_yield_provider.csv',all_rows)\n        results['cny_yield']={'rows':len(all_rows),'state':'PROVIDER_CURRENT_VINTAGE_UNCERTIFIED','units':'provider percent; do not divide/interpret until verified'}\n    except (DataError,ValueError) as e:results['cny_yield']={'state':'UNAVAILABLE','error':str(e)}\n    # Fixed public HKMA endpoints are attempted, not assumed to exist or to return a complete history.\n    for name,path in [('hk_fx','er-ir/er-eeri-daily'),('hkd_yield','gov-bond/instit-bond-price-yield-daily')]:\n        all_rows=[]\n        try:\n            for off in range(0,20000,1000):\n                params={'offset':off,'pagesize':1000}\n                if name=='hkd_yield':params['segment']='Benchmark'\n                url='https://api.hkma.gov.hk/public/market-data-and-statistics/monthly-statistical-bulletin/'+path+'?'+urllib.parse.urlencode(params)\n                raw,_,_=fetcher.get(url);x=json.loads(raw);r=x.get('result',{})\n                records=r.get('records')\n                if not isinstance(records,list):raise DataError('HKMA_SCHEMA_UNVERIFIED')\n                all_rows.extend([r for r in records if '2010-01-01'<=str(r.get('end_of_day',''))[:10]<=asof])\n                if not records or len(records)<1000:break\n                if off+len(records)>=int(r.get('datasize',20000)):break\n            rows_write(fetcher.root/(name+'_candidates.csv'),all_rows)\n            results[name]={'state':'OFFICIAL_API_DOWNLOAD_REVIEW_REQUIRED','rows':len(all_rows),'units':'HKD per unit foreign currency' if name=='hk_fx' else 'percent per annum','schema_documented':True,'historical_publication_vintages_certified':False}\n        except (DataError,ValueError) as e:results[name]={'state':'UNAVAILABLE','error':str(e)}\n    dump(fetcher.root/'macro_status.json',results)\n\n\ndef collect(shard,nshards,root,asof,seconds):\n    conf=json.loads((INPUT/'collection_contract.json').read_text());securities=json.loads((INPUT/'securities.json').read_text())\n    selected=[s for i,s in enumerate(securities) if i%nshards==shard]\n    fetcher=Fetcher(root,seconds=seconds);root=Path(root);summaries=[]\n    dump(root/'START.json',{'version':conf['version'],'asof':asof,'shard':shard,'assigned':selected,'strict_pit_certified':False})\n    seeds=json.loads((INPUT/'seed_documents.json').read_text())\n    for sec in selected:\n        sym=sec['symbol'];folder=root/'securities'/sym;folder.mkdir(parents=True,exist_ok=True)\n        summary={'symbol':sym,'name':sec['name'],'kind':sec['kind'],'asof':asof,'quality_score':None,\n          'valuation_score':None,'action_score':None,'formal_buy1':None,'order_permission':0,\n          'full_model_status':'EVIDENCE_COLLECTION_ONLY','pdf_archives':0,'errors':[]}\n        try:\n            fetcher.check()\n            if sec['kind']!='BENCHMARK':\n                anns,errors,maperr=cninfo_list(fetcher,sec,asof);summary['metadata_queries_failed']=len(errors)\n                rows_write(folder/'announcement_metadata.csv',anns);dump(folder/'metadata_errors.json',{'queries':errors,'map':maperr})\n                for sd in seeds:\n                    if sd['symbol']==sym and sd['url'] not in [a['url'] for a in anns]:\n                        anns.append({**sd,'category':'SEED_DOCUMENT','timestamp_precision':'INHERITED_DATE_NOT_CERTIFIED'})\n                # Periodic latest first, then event candidates. No silent source-success = completeness.\n                anns=sorted(anns,key=lambda a:(a.get('category')!='PERIODIC_REPORT',-(int(re.search(r'20\\d{2}',a.get('title','')).group()) if re.search(r'20\\d{2}',a.get('title','')) else 0)))\n                archived=[]\n                for a in anns:\n                    if a.get('category') not in ('PERIODIC_REPORT','EVENT_CANDIDATE','SEED_DOCUMENT'):continue\n                    try:\n                        raw,m,p=fetcher.get(a['url'],kind='pdf');rec={**a,**m,'path':str(p.relative_to(root))}\n                        # Pdf extraction is isolated so one corrupt/slow file cannot stall an entire shard.\n                        parsed=Path(str(p)+'.index.json')\n                        if not parsed.exists():\n                            cmd=[sys.executable,str(Path(__file__).resolve()),'extract','--pdf',str(p)]\n                            try:subprocess.run(cmd,timeout=90,check=True,stdout=subprocess.DEVNULL)\n                            except Exception as e:dump(parsed,{'parse_state':'MANUAL_REVIEW','error':str(e)})\n                        rec['parse']=json.loads(parsed.read_text()) if parsed.exists() else {'parse_state':'MISSING'}\n                        archived.append(rec)\n                    except DataError as e:summary['errors'].append({'url':a['url'],'error':str(e)})\n                    dump(folder/'document_manifest.json',archived)\n                summary['pdf_archives']=len(archived)\n            # Independent market-data worker is separate from the report fetcher's session.\n            if sym.endswith(('.SH','.SZ')):\n                worker=folder/'baostock';remaining=max(1,min(1200,int(fetcher.deadline-time.monotonic())))\n                with (folder/'baostock.log').open('w') as log:\n                    try:subprocess.run([sys.executable,str(Path(__file__).resolve()),'baostock','--symbol',sym,'--root',str(worker),'--asof',asof],timeout=remaining,stdout=log,stderr=subprocess.STDOUT,check=True)\n                    except Exception as e:summary['errors'].append({'step':'baostock','error':str(e)})\n                p=worker/'daily_raw.csv'\n                if p.exists():\n                    bars=rows_read(p);issues=bars_validate(bars)\n                    summary.update(daily_raw_rows=len(bars),daily_first=bars[0]['date'] if bars else None,daily_last=bars[-1]['date'] if bars else None,daily_qc_errors=len(issues))\n                    rows_write(folder/'daily_qc.csv',issues,['date','row','issue'])\n            try:\n                bars,errors=tencent_candidate(fetcher,sec,asof)\n                rows_write(folder/'tencent_daily.csv',bars);dump(folder/'tencent_errors.json',errors)\n                summary['second_source_queries_failed']=len(errors)\n                rawbars=[r for r in bars if r['adjustment']=='RAW'];summary['second_source_raw_rows']=len(rawbars)\n                p=folder/'baostock'/'daily_raw.csv'\n                if p.exists() and rawbars:\n                    bm={r['date']:r for r in rows_read(p)};diff=[]\n                    for r in rawbars:\n                        if r['date'] in bm:\n                            for col in ('open','high','low','close'):\n                                try:\n                                    delta=float(r[col])-float(bm[r['date']][col])\n                                    if abs(delta)>0.011:diff.append({'date':r['date'],'field':col,'difference':delta})\n                                except ValueError:diff.append({'date':r['date'],'field':col,'difference':'INVALID'})\n                    rows_write(folder/'price_source_disagreements.csv',diff,['date','field','difference']);summary['price_source_disagreements']=len(diff)\n            except Deadline:raise\n            summary['status']=('PARTIAL_DATA' if summary['errors'] or summary.get('metadata_queries_failed',0) or summary.get('second_source_queries_failed',0) or (sec['kind']!='BENCHMARK' and summary['pdf_archives']==0) or (summary.get('daily_raw_rows',0)+summary.get('second_source_raw_rows',0)==0) else 'COLLECTED_REVIEW_REQUIRED')\n        except Deadline as e:\n            summary['status']='PARTIAL_DEADLINE';summary['errors'].append(str(e));dump(folder/'SUMMARY.json',summary);summaries.append(summary);break\n        except Exception as e:summary['status']='PARTIAL_ERROR';summary['errors'].append(str(e))\n        dump(folder/'SUMMARY.json',summary);summaries.append(summary);dump(root/'shard_summary.json',summaries)\n    if shard==0:\n        try:macro_candidates(fetcher,asof)\n        except Exception as e:dump(root/'macro_failure.json',{'error':str(e)})\n    done={r['symbol'] for r in summaries}\n    for sec in selected:\n        if sec['symbol'] not in done:summaries.append({'symbol':sec['symbol'],'name':sec['name'],'status':'NOT_REACHED_DEADLINE','order_permission':0})\n    dump(root/'shard_summary.json',summaries)\n    dump(root/'END.json',{'assigned':len(selected),'summarized':len(summaries),'strict_pit_certified':False,'new_full_models_completed':0})\n\n\ndef merge(root,out):\n    root=Path(root);out=Path(out);out.mkdir(parents=True,exist_ok=True)\n    securities=json.loads((INPUT/'securities.json').read_text());found={}\n    for p in root.rglob('shard_summary.json'):\n        for row in json.loads(p.read_text()):\n            sym=row['symbol']\n            if sym in found:raise DataError('DUPLICATE_SECURITY_SHARD_'+sym)\n            found[sym]=row\n    rows=[]\n    for s in securities:\n        rows.append(found.get(s['symbol'],{'symbol':s['symbol'],'name':s['name'],'status':'MISSING_SHARD','order_permission':0}))\n    rows_write(out/'SECURITY_COVERAGE.csv',rows)\n    summary={'version':'SEC25-COLLECT-ONEFILE-RC','securities_requested':len(securities),'results_received':len(found),\n       'pdf_archive_count':sum(r.get('pdf_archives',0) for r in rows),\n       'raw_daily_rows':sum(r.get('daily_raw_rows',0) for r in rows),'status_counts':dict(Counter(r['status'] for r in rows)),\n       'strict_pit_certified':False,'formal_ke_certified':False,'full_models_completed':0,'orders_enabled':False,\n       'status':('INCOMPLETE_MISSING_SHARDS' if len(found)!=len(securities) else 'PARTIAL_DATA' if any(r.get('status')!='COLLECTED_REVIEW_REQUIRED' for r in rows) else 'ACQUISITION_FINISHED_REVIEW_REQUIRED')}\n    dump(out/'RUN_SUMMARY.json',summary)\n    report=['# SEC25 acquisition result','', '**This is a data/evidence package, not a 90-point model or a trading authorization.**','',\n       'All raw files remain in shards. Original report bytes, metadata, extracted pages, provider CSVs, failure logs and hashes must travel together.','',\n       '|Symbol|Name|State|PDFs|Raw daily rows|','|---|---|---|---:|---:|']\n    for r in rows:report.append(f\"|{r['symbol']}|{r.get('name','')}|{r['status']}|{r.get('pdf_archives','NA')}|{r.get('daily_raw_rows','NA')}|\")\n    report += ['', '## Not certified by this program',\n       'First tradable timestamp; complete historical issuer universe; all corporate-action economics; common-share distributable cash; normalized forecasts; Q/V/A scores; formal Ke; K1-K4 performance; forward OOS.',\n       'A zero error count is not proof of completeness. Missing data are not zero. QFQ is not an event-certified total-return series.']\n    (out/'REPORT.md').write_text('\\n'.join(report),encoding='utf-8')\n    if os.environ.get('GITHUB_STEP_SUMMARY'):\n        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\\n'.join(report))\n    return summary\n\n\ndef manifest(root):\n    root=Path(root);entries=[]\n    for p in sorted(root.rglob('*')):\n        if p.is_file() and p.name!='MANIFEST_SHA256.json':entries.append({'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':file_sha(p)})\n    dump(root/'MANIFEST_SHA256.json',entries)\n\n\ndef main():\n    ap=argparse.ArgumentParser();ap.add_argument('mode',choices=['collect','merge','baostock','extract','manifest'])\n    ap.add_argument('--root',default='work');ap.add_argument('--out',default='final');ap.add_argument('--shard',type=int,default=0)\n    ap.add_argument('--nshards',type=int,default=8);ap.add_argument('--asof',default='2026-09-18');ap.add_argument('--seconds',type=int,default=10800)\n    ap.add_argument('--symbol');ap.add_argument('--pdf');a=ap.parse_args();date.fromisoformat(a.asof)\n    if a.mode=='collect':collect(a.shard,a.nshards,a.root,a.asof,a.seconds)\n    elif a.mode=='merge':merge(a.root,a.out)\n    elif a.mode=='manifest':manifest(a.root)\n    elif a.mode=='baostock':baostock_worker(a.symbol,a.root,a.asof)\n    else:\n        n,hits,state=extract_pdf(a.pdf);dump(str(a.pdf)+'.index.json',{'pages':n,'hits':hits,'parse_state':state})\nif __name__=='__main__':main()\n","tests/test_collector.py":"import unittest,tempfile,json,sys,urllib.error\nfrom pathlib import Path\nfrom unittest.mock import patch\nsys.path.insert(0,str(Path(__file__).resolve().parents[1]/'src'))\nimport collector as c\n\nclass CoreTests(unittest.TestCase):\n def test_pdf_html_rejected(self):\n  with self.assertRaises(c.DataError):c.Fetcher.validate(b'<html>403</html>','pdf')\n def test_pdf_eof_required(self):\n  with self.assertRaises(c.DataError):c.Fetcher.validate(b'%PDF-1.7\\n','pdf')\n def test_pdf_candidate_not_certification(self):c.Fetcher.validate(b'%PDF-1.7\\n%%EOF\\n','pdf')\n def test_json_scalar_rejected(self):\n  with self.assertRaises(c.DataError):c.Fetcher.validate(b'3','json')\n def test_json_empty_rejected(self):\n  with self.assertRaises(c.DataError):c.Fetcher.validate(b'','json')\n def test_url_blocks_secret_exfiltration(self):\n  for u in ['https://attacker.invalid/x','http://static.cninfo.com.cn/x','file:///etc/passwd','https://me:secret@static.cninfo.com.cn/x']:\n   with self.subTest(u=u),self.assertRaises(c.DataError):c.require_url(u)\n def test_url_allows_source(self):self.assertEqual(c.require_url('https://static.cninfo.com.cn/a.pdf'),'https://static.cninfo.com.cn/a.pdf')\n def test_title_full(self):self.assertEqual(c.doc_class('国元证券：2025年年度报告'),'PERIODIC_REPORT')\n def test_title_summary(self):self.assertEqual(c.doc_class('2025年年度报告摘要'),'OTHER')\n def test_title_related(self):self.assertEqual(c.doc_class('关于2025年年度报告的更正公告'),'REPORT_RELATED')\n def test_title_event(self):self.assertEqual(c.doc_class('2025年度权益分派实施公告'),'EVENT_CANDIDATE')\n def test_no_midnight_certification(self):self.assertEqual(c.publish_meta(1648483200000)[1],'DATE_ONLY_OR_MIDNIGHT_UNVERIFIED')\n def test_bad_time_is_unknown(self):self.assertEqual(c.publish_meta(None),(None,'UNKNOWN'))\n def test_pagination_complete(self):\n  pages={1:{'totalAnnouncement':3,'announcements':[{'id':1},{'id':2}]},2:{'totalAnnouncement':3,'announcements':[{'id':3}]}}\n  self.assertEqual(len(c.paginate_json(lambda p:pages[p])),3)\n def test_pagination_empty(self):self.assertEqual(c.paginate_json(lambda p:{'totalAnnouncement':0,'announcements':None}),[])\n def test_pagination_changed_total(self):\n  with self.assertRaisesRegex(c.DataError,'TOTAL_CHANGED'):c.paginate_json(lambda p:{'totalAnnouncement':p+2,'announcements':[{'id':p}]})\n def test_pagination_repeat(self):\n  with self.assertRaisesRegex(c.DataError,'REPEATED_PAGE'):c.paginate_json(lambda p:{'totalAnnouncement':3,'announcements':[{'id':1}]})\n def test_pagination_early_empty(self):\n  with self.assertRaisesRegex(c.DataError,'EARLY_EMPTY'):c.paginate_json(lambda p:{'totalAnnouncement':3,'announcements':[]})\n def test_pagination_schema(self):\n  with self.assertRaisesRegex(c.DataError,'SCHEMA_CHANGED'):c.paginate_json(lambda p:{'data':[]})\n def test_pagination_cap(self):\n  with self.assertRaisesRegex(c.DataError,'CAP'):c.paginate_json(lambda p:{'totalAnnouncement':3,'announcements':[{'id':p}]},max_pages=2)\n def test_ohlc_valid(self):self.assertEqual(c.bars_validate([dict(date='2026-09-18',open='10',high='12',low='9',close='11')]),[])\n def test_ohlc_order(self):self.assertTrue(c.bars_validate([dict(date='2026-09-18',open='10',high='8',low='9',close='11')]))\n def test_duplicate_bar(self):\n  b=dict(date='2026-09-18',open='10',high='12',low='9',close='11');self.assertIn('DUPLICATE_DATE',[x['issue'] for x in c.bars_validate([b,b])])\n def test_nonfinite_bar(self):self.assertTrue(c.bars_validate([dict(date='2026-09-18',open='nan',high='12',low='9',close='11')]))\n def test_empty_rows_explicit_header(self):\n  with tempfile.TemporaryDirectory() as td:\n   p=Path(td)/'x.csv';c.rows_write(p,[]);self.assertIn('status',p.read_text(encoding='utf-8-sig'))\n def test_deadline(self):\n  with tempfile.TemporaryDirectory() as td:\n   f=c.Fetcher(td,seconds=-1)\n   with self.assertRaises(c.Deadline):f.check()\n def test_retries_and_cache_corruption(self):\n  class Resp:\n   status=200;headers={'Content-Type':'application/json'}\n   def geturl(self):return 'https://www.cninfo.com.cn/a'\n   def read(self,*a):return b'{\"ok\":true}'\n   def __enter__(self):return self\n   def __exit__(self,*a):pass\n  with tempfile.TemporaryDirectory() as td,patch('collector.time.sleep'):\n   f=c.Fetcher(td,delay=0);f.opener.open=unittest.mock.Mock(side_effect=[urllib.error.URLError('temporary'),Resp()])\n   raw,m,p=f.get('https://www.cninfo.com.cn/a');self.assertEqual(f.opener.open.call_count,2)\n   f.opener.open=unittest.mock.Mock(side_effect=RuntimeError('must not call'))\n   self.assertEqual(f.get('https://www.cninfo.com.cn/a')[0],raw)\n   p.write_bytes(b'corrupted');f.opener.open=unittest.mock.Mock(return_value=Resp())\n   self.assertEqual(f.get('https://www.cninfo.com.cn/a')[0],raw);self.assertEqual(f.opener.open.call_count,1)\n def test_merge_incomplete_preserves_universe(self):\n  with tempfile.TemporaryDirectory() as td:\n   td=Path(td);inp=td/'inputs';inp.mkdir();c.dump(inp/'securities.json',[{'symbol':'a','name':'A'},{'symbol':'b','name':'B'}]);part=td/'parts';part.mkdir()\n   c.dump(part/'shard_summary.json',[{'symbol':'a','name':'A','status':'PARTIAL_DATA','pdf_archives':0}])\n   with patch.object(c,'INPUT',inp):s=c.merge(part,td/'out')\n   self.assertEqual(s['securities_requested'],2);self.assertEqual(s['status'],'INCOMPLETE_MISSING_SHARDS');self.assertEqual(s['full_models_completed'],0)\n   self.assertEqual(len(c.rows_read(td/'out'/'SECURITY_COVERAGE.csv')),2)\n def test_merge_all_partial_not_complete(self):\n  with tempfile.TemporaryDirectory() as td:\n   td=Path(td);inp=td/'inputs';inp.mkdir();c.dump(inp/'securities.json',[{'symbol':'a','name':'A'}]);part=td/'parts';part.mkdir();c.dump(part/'shard_summary.json',[{'symbol':'a','status':'PARTIAL_DATA'}])\n   with patch.object(c,'INPUT',inp):self.assertEqual(c.merge(part,td/'out')['status'],'PARTIAL_DATA')\n def test_merge_duplicate_fail(self):\n  with tempfile.TemporaryDirectory() as td:\n   td=Path(td);inp=td/'inputs';inp.mkdir();c.dump(inp/'securities.json',[{'symbol':'a','name':'A'}]);part=td/'parts'\n   for x in ['x','y']:c.dump(part/x/'shard_summary.json',[{'symbol':'a','status':'PARTIAL_DATA'}])\n   with patch.object(c,'INPUT',inp),self.assertRaises(c.DataError):c.merge(part,td/'out')\nif __name__=='__main__':unittest.main(verbosity=2)\n","inputs/collection_contract.json":"{\n  \"version\": \"SEC25-COLLECT-ONEFILE-RC\",\n  \"asof\": \"2026-09-18\",\n  \"daily_start\": \"2010-01-01\",\n  \"annual_report_fy_start\": 2010,\n  \"latest_interims_start\": \"2025-01-01\",\n  \"shards\": 8,\n  \"max_parallel\": 2,\n  \"worker_soft_seconds\": 10800,\n  \"scope\": \"45 inherited A-share research identifiers, 14 corresponding H identifiers including historical Haitong, 3 benchmark candidates. Not certified all-industry dynamic universe.\",\n  \"original_bytes_required\": true,\n  \"source_failure_is_missing_not_zero\": true,\n  \"cached_json_ttl_seconds\": 86400,\n  \"pdf_cache_hash_verified\": true,\n  \"private_account_inputs\": false,\n  \"place_orders\": false,\n  \"formal_PIT_certification\": false,\n  \"automatic_full_model_scoring\": false,\n  \"share_prices_to_fundamental_currency_bridge\": \"manual_verified_not_inferred\",\n  \"source_policy\": \"Only accessible public endpoints. No bypassing authentication or access controls. Source terms apply.\"\n}","inputs/securities.json":"[\n  {\n    \"symbol\": \"000166.SZ\",\n    \"name\": \"申万宏源\",\n    \"kind\": \"CN_STOCK\",\n    \"issuer_key\": \"000166.SZ\",\n    \"scope\": \"CORE_DIRECT\",\n    \"historical_identity_certified\": false\n  },\n  {\n    \"symbol\": \"000